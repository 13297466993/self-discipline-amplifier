<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自律放大器 · 图标与插画集</title>
<style>
:root{
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r2:12px;
}
html[data-theme="light"]{
  --bgbase:#f1f4fc;
  --blobA:rgba(99,120,255,.30); --blobB:rgba(45,190,215,.22); --blobC:rgba(160,120,255,.20);
  --ink:#131829; --ink2:#4b5674; --mute:#8791aa;
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.5);
  --line:rgba(24,34,66,.12); --lineS:rgba(24,34,66,.07);
  --acc:#4a5bd8; --acc2:#1f9fb8;
  --field:rgba(255,255,255,.85);
  --sh:0 1px 2px rgba(20,30,60,.05),0 10px 28px -16px rgba(20,30,60,.24);
  --ok:#12a06a;
}
html[data-theme="dark"]{
  --bgbase:#04060e;
  --blobA:rgba(86,104,255,.34); --blobB:rgba(24,180,210,.22); --blobC:rgba(150,80,255,.26);
  --ink:#e9eeff; --ink2:#a5b1d5; --mute:#6d7a9e;
  --glass:rgba(16,22,42,.66); --glass2:rgba(16,22,42,.44);
  --line:rgba(255,255,255,.11); --lineS:rgba(255,255,255,.06);
  --acc:#8b9bff; --acc2:#3ad3e8;
  --field:rgba(6,10,24,.6);
  --sh:0 1px 2px rgba(0,0,0,.5),0 16px 38px -18px rgba(0,0,0,.8);
  --ok:#12be7e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);line-height:1.62;
  background:var(--bgbase);min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:-25% -12%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(46% 38% at 14% 6%,var(--blobA),transparent 66%),
    radial-gradient(42% 34% at 88% 10%,var(--blobB),transparent 64%),
    radial-gradient(52% 44% at 62% 98%,var(--blobC),transparent 66%);
  filter:blur(34px);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--lineS) 1px,transparent 1px),linear-gradient(90deg,var(--lineS) 1px,transparent 1px);
  background-size:58px 58px;
  -webkit-mask-image:radial-gradient(82% 62% at 50% 14%,#000,transparent 80%);
  mask-image:radial-gradient(82% 62% at 50% 14%,#000,transparent 80%);
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 90px}

.topbar{position:sticky;top:0;z-index:60;background:var(--glass);
  backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
  border-bottom:1px solid var(--lineS)}
.topbarIn{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;
  gap:14px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.logo svg{width:22px;height:22px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand span{display:block;font-size:11.5px;color:var(--mute);font-weight:500}

.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--glass2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--mute);font:inherit;font-size:12.5px;
  font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer;transition:.16s}
.seg button.on{background:var(--glass);color:var(--ink);box-shadow:var(--sh)}
.btn{border:1px solid var(--line);background:var(--glass2);color:var(--ink2);font:inherit;font-size:12.5px;
  font-weight:600;padding:8px 13px;border-radius:11px;cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--ink)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.search{position:relative;flex:1;min-width:150px;max-width:260px}
.search input{width:100%;font:inherit;font-size:13px;padding:9px 12px 9px 34px;border-radius:11px;
  border:1px solid var(--line);background:var(--field);color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  color:var(--mute);pointer-events:none}

.hero{padding:38px 0 8px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--acc);font-weight:700}
.hero h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;letter-spacing:-.024em;margin:8px 0 10px;
  background:linear-gradient(120deg,var(--ink),var(--acc) 62%,var(--acc2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--ink2);font-size:14px;max-width:660px;margin:0}
.tips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tip{font-size:12px;color:var(--mute);background:var(--glass2);border:1px solid var(--lineS);
  padding:4px 10px;border-radius:999px}

section{margin-top:38px}
.secTop{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.secTop h2{font-size:17px;font-weight:800;letter-spacing:-.018em;margin:0}
.secTop em{font-style:normal;font-size:12.5px;color:var(--mute)}
.secTop .cnt{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:700;
  background:var(--glass2);border:1px solid var(--lineS);padding:2px 8px;border-radius:999px}
.secDesc{font-size:12.8px;color:var(--mute);margin:0 0 14px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
.grid.art{grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.cell{background:var(--glass);border:1px solid var(--line);border-radius:var(--r2);padding:15px 10px 12px;
  display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;transition:.18s;
  box-shadow:var(--sh);position:relative}
.cell:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 18px 40px -20px rgba(0,0,0,.4)}
.cell .nm{font-size:12.5px;font-weight:700;text-align:center;line-height:1.35}
.cell .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);word-break:break-all;text-align:center}
.cell.art{padding:16px}
.cell.art .art{width:100%;height:auto;display:block}
.ic{color:var(--ink2);display:block}

.empty{padding:26px 14px;text-align:center;color:var(--mute);font-size:13px;
  background:var(--glass2);border:1px dashed var(--line);border-radius:var(--r2)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:200;
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);box-shadow:var(--sh);border-radius:12px;padding:11px 17px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.24s;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--lineS);
  font-size:12.3px;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:640px){
  .wrap{padding:0 12px 70px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .grid.art{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ 内联 sprite（file:// 下外链 use 会被 CORS 拦，必须内联） ============ -->
<!-- 内联 sprite 必须用 width/height=0，不能 display:none：display:none 的容器里渐变不渲染，
     会让所有走 url(#渐变) 的笔触整条消失（只剩 currentColor 的副笔触，看着像半截灰影） -->
<svg id="sprite" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<!--
  自律放大器 · 矢量图标与插画集
  用法：<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><use href="icons.svg#i-today"/></svg>
  主笔触 = 品牌渐变（跟随 acc / acc2 两个 CSS 变量，没定义时用兜底色），副笔触 = currentColor（跟随文字色）
  渐变一律用 userSpaceOnUse：objectBoundingBox 会让水平/垂直线段的包围盒退化成零高宽，线条整个不渲染
-->
<defs>
  <!-- 24×24 图标用 -->
  <linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
    <stop offset="0" style="stop-color:var(--acc,#4a5bd8)"/>
    <stop offset="1" style="stop-color:var(--acc2,#1f9fb8)"/>
  </linearGradient>
  <linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="0" y2="24">
    <stop offset="0" style="stop-color:var(--acc2,#1f9fb8)"/>
    <stop offset="1" style="stop-color:var(--acc,#4a5bd8)"/>
  </linearGradient>
  <linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24">
    <stop offset="0" style="stop-color:var(--acc,#4a5bd8);stop-opacity:.92"/>
    <stop offset="1" style="stop-color:var(--acc2,#1f9fb8);stop-opacity:.5"/>
  </linearGradient>
  <linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
    <stop offset="0" style="stop-color:var(--acc,#4a5bd8);stop-opacity:.2"/>
    <stop offset="1" style="stop-color:var(--acc2,#1f9fb8);stop-opacity:.03"/>
  </linearGradient>

  <!-- 200×140 插画用 -->
  <linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="140">
    <stop offset="0" style="stop-color:var(--acc,#4a5bd8)"/>
    <stop offset="1" style="stop-color:var(--acc2,#1f9fb8)"/>
  </linearGradient>
  <linearGradient id="gL2" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="0" y2="140">
    <stop offset="0" style="stop-color:var(--acc2,#1f9fb8)"/>
    <stop offset="1" style="stop-color:var(--acc,#4a5bd8)"/>
  </linearGradient>
  <linearGradient id="gLf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="140">
    <stop offset="0" style="stop-color:var(--acc,#4a5bd8);stop-opacity:.92"/>
    <stop offset="1" style="stop-color:var(--acc2,#1f9fb8);stop-opacity:.5"/>
  </linearGradient>
  <linearGradient id="gLs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="140">
    <stop offset="0" style="stop-color:var(--acc,#4a5bd8);stop-opacity:.2"/>
    <stop offset="1" style="stop-color:var(--acc2,#1f9fb8);stop-opacity:.03"/>
  </linearGradient>
</defs>

<!-- ============ 导航与全局 ============ -->
<symbol id="i-today" data-g="nav" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>每日行事</title>
  <rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M8 3v3.6M16 3v3.6" stroke="currentColor" stroke-width="1.6" opacity=".45"/>
  <path d="M8.2 13.6l2.2 2.2 4.4-4.7" stroke="url(#gb)" stroke-width="1.9"/>
</symbol>

<symbol id="i-library" data-g="nav" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>思维模型库</title>
  <path d="M12 3.4l8 4.3-8 4.3-8-4.3z" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M4 12.2l8 4.3 8-4.3" stroke="url(#gb)" stroke-width="1.75"/>
  <path d="M4 16.6l8 4.3 8-4.3" stroke="currentColor" stroke-width="1.6" opacity=".42"/>
</symbol>

<symbol id="i-settings" data-g="nav" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>设置</title>
  <path d="M4 7.5h9M19 7.5h1" stroke="url(#ga)" stroke-width="1.75"/>
  <circle cx="15.2" cy="7.5" r="2.3" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M4 16.5h3.5M13.5 16.5h6.5" stroke="url(#gb)" stroke-width="1.75"/>
  <circle cx="9.5" cy="16.5" r="2.3" stroke="url(#gb)" stroke-width="1.75"/>
</symbol>

<symbol id="i-theme" data-g="nav" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>主题切换</title>
  <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M17.4 3.2l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z" stroke="url(#gb)" stroke-width="1.2"/>
</symbol>

<symbol id="i-search" data-g="nav" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>搜索</title>
  <circle cx="10.6" cy="10.6" r="6.3" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M15.3 15.3l4.4 4.4" stroke="url(#gb)" stroke-width="1.9"/>
</symbol>

<symbol id="i-close" data-g="nav" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>关闭</title>
  <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" stroke="url(#ga)" stroke-width="1.85"/>
</symbol>

<!-- ============ 三步向导 ============ -->
<symbol id="i-step1" data-g="step" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>目标分解 · 逐层拆解</title>
  <rect x="3.6" y="15.4" width="16.8" height="4.6" rx="1.6" stroke="url(#ga)" stroke-width="1.75"/>
  <rect x="5.4" y="10.2" width="13.2" height="4.6" rx="1.6" stroke="url(#gb)" stroke-width="1.75"/>
  <rect x="7.4" y="5" width="9.2" height="4.6" rx="1.6" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M9.9 2.6v.9M14.1 2.6v.9" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
</symbol>

<symbol id="i-step2" data-g="step" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>优先级排序 · 四象限</title>
  <rect x="3.4" y="3.4" width="17.2" height="17.2" rx="2.6" stroke="currentColor" stroke-width="1.5" opacity=".42"/>
  <path d="M12 3.6v16.8M3.6 12h16.8" stroke="url(#ga)" stroke-width="1.75"/>
  <circle cx="7.9" cy="7.9" r="1.9" fill="url(#ga)" stroke="none"/>
  <circle cx="16.1" cy="16.1" r="1.5" fill="url(#gb)" stroke="none"/>
</symbol>

<symbol id="i-step3" data-g="step" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>今日时间块</title>
  <circle cx="12" cy="10.4" r="7" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M12 6.6v4l3.2 2.1" stroke="url(#gb)" stroke-width="1.75"/>
  <rect x="6.6" y="18.4" width="10.8" height="2.8" rx="1.4" stroke="url(#ga)" stroke-width="1.75"/>
</symbol>

<!-- ============ 积木五层 ============ -->
<symbol id="i-brick-text" data-g="brick" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>这件事到底是什么</title>
  <rect x="3.4" y="6" width="17.2" height="12" rx="2.6" stroke="currentColor" stroke-width="1.5" opacity=".42"/>
  <path d="M6.8 10.4h7.2" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M6.8 14.2h9.6" stroke="url(#gb)" stroke-width="1.75"/>
  <path d="M15.6 9.2v2.6" stroke="url(#ga)" stroke-width="1.9"/>
</symbol>

<symbol id="i-brick-basis" data-g="brick" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>基本命题 · 地基</title>
  <path d="M3.6 19.4h16.8" stroke="url(#ga)" stroke-width="2.1"/>
  <path d="M12 19.4V9.6" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M8 13.2l4-4 4 4" stroke="url(#gb)" stroke-width="1.75"/>
  <path d="M9.4 6.6h5.2" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
</symbol>

<symbol id="i-brick-target" data-g="brick" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>可验证的小目标</title>
  <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="3.4" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M8.2 12.2l2.8 2.8 5-5.4" stroke="url(#gb)" stroke-width="2"/>
</symbol>

<symbol id="i-brick-gap" data-g="brick" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>缺口 · 缺什么</title>
  <path d="M3.4 12h5.6M15 12h5.6" stroke="url(#ga)" stroke-width="2"/>
  <path d="M12 8.6v6.8" stroke="currentColor" stroke-width="1.5" opacity=".5" stroke-dasharray="2 2.6"/>
  <path d="M9.6 8.2l-1.4-2.2M14.4 8.2l1.4-2.2" stroke="url(#gb)" stroke-width="1.6"/>
</symbol>

<symbol id="i-brick-action" data-g="brick" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>第一步动作</title>
  <path d="M4.6 19.4h6.2" stroke="currentColor" stroke-width="1.6" opacity=".42"/>
  <path d="M6.2 19.4l4.6-8.6" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M11.4 4.4h8.2v8.2" stroke="url(#gb)" stroke-width="1.9"/>
  <path d="M19.6 4.4L11 13" stroke="url(#ga)" stroke-width="1.9"/>
</symbol>

<!-- ============ 四象限 ============ -->
<symbol id="i-q1" data-g="quad" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>重要且紧急 · 立刻做</title>
  <path d="M13.4 3.2L6.6 13.4h4.4L10 20.8l7.4-10.6h-4.6z" stroke="url(#ga)" stroke-width="1.75"/>
</symbol>

<symbol id="i-q2" data-g="quad" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>重要不紧急 · 排进日程</title>
  <path d="M12 20.4v-7.2" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M12 13.4c-3.1 0-4.7-1.9-4.7-4.4 2.7 0 4.7 1.7 4.7 4.4z" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M12 13.4c3.1 0 4.7-1.9 4.7-4.4-2.7 0-4.7 1.7-4.7 4.4z" stroke="url(#gb)" stroke-width="1.75"/>
</symbol>

<symbol id="i-q3" data-g="quad" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>紧急不重要 · 委托出去</title>
  <path d="M3.4 12h8.4" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M8.6 8.9l3.2 3.1-3.2 3.1" stroke="url(#ga)" stroke-width="1.75"/>
  <rect x="14.6" y="8.4" width="6" height="7.2" rx="1.8" stroke="url(#gb)" stroke-width="1.75"/>
</symbol>

<symbol id="i-q4" data-g="quad" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>不重要不紧急 · 写下来不做</title>
  <circle cx="12" cy="12" r="8.2" stroke="url(#ga)" stroke-width="1.75"/>
  <path d="M7.4 16.6l9.2-9.2" stroke="url(#gb)" stroke-width="1.9"/>
</symbol>

<!-- ============ 知识库九分类 ============ -->
<symbol id="i-cat-goal" data-g="cat" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>目标与拆解</title>
  <circle cx="9.6" cy="9.6" r="6.3" stroke="url(#ga)" stroke-width="1.75"/>
  <circle cx="9.6" cy="9.6" r="2.4" stroke="url(#gb)" stroke-width="1.6"/>
  <path d="M14.4 14.4L20.2 20.2" stroke="url(#ga)" stroke-width="1.9"/>
</symbol>

<symbol id="i-cat-rank" data-g="cat" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>排序与取舍</title>
  <path d="M3.6 7.4h13.2" stroke="url(#ga)" stroke-width="2"/>

var MANIFEST = [{"k":"step","n":"三步向导","d":"每日行事的三个步骤，是这套图标的主角","items":[{"id":"i-step1","g":"step","vb":"0 0 24 24","n":"目标分解 · 逐层拆解"},{"id":"i-step2","g":"step","vb":"0 0 24 24","n":"优先级排序 · 四象限"},{"id":"i-step3","g":"step","vb":"0 0 24 24","n":"今日时间块"}]},{"k":"brick","n":"积木五层","d":"目标分解的五个层级，一层一图标","items":[{"id":"i-brick-text","g":"brick","vb":"0 0 24 24","n":"这件事到底是什么"},{"id":"i-brick-basis","g":"brick","vb":"0 0 24 24","n":"基本命题 · 地基"},{"id":"i-brick-target","g":"brick","vb":"0 0 24 24","n":"可验证的小目标"},{"id":"i-brick-gap","g":"brick","vb":"0 0 24 24","n":"缺口 · 缺什么"},{"id":"i-brick-action","g":"brick","vb":"0 0 24 24","n":"第一步动作"}]},{"k":"quad","n":"四象限","d":"对应四种处置动作，不只是色块","items":[{"id":"i-q1","g":"quad","vb":"0 0 24 24","n":"重要且紧急 · 立刻做"},{"id":"i-q2","g":"quad","vb":"0 0 24 24","n":"重要不紧急 · 排进日程"},{"id":"i-q3","g":"quad","vb":"0 0 24 24","n":"紧急不重要 · 委托出去"},{"id":"i-q4","g":"quad","vb":"0 0 24 24","n":"不重要不紧急 · 写下来不做"}]},{"k":"cat","n":"知识库九分类","d":"35 个思维模型的九个抽屉","items":[{"id":"i-cat-goal","g":"cat","vb":"0 0 24 24","n":"目标与拆解"},{"id":"i-cat-rank","g":"cat","vb":"0 0 24 24","n":"排序与取舍"},{"id":"i-cat-decide","g":"cat","vb":"0 0 24 24","n":"决策与判断"},{"id":"i-cat-root","g":"cat","vb":"0 0 24 24","n":"问题与根因"},{"id":"i-cat-exec","g":"cat","vb":"0 0 24 24","n":"执行与节奏"},{"id":"i-cat-emo","g":"cat","vb":"0 0 24 24","n":"情绪与内耗"},{"id":"i-cat-talk","g":"cat","vb":"0 0 24 24","n":"表达与沟通"},{"id":"i-cat-habit","g":"cat","vb":"0 0 24 24","n":"习惯与养成"},{"id":"i-cat-learn","g":"cat","vb":"0 0 24 24","n":"学习与创意"}]},{"k":"nav","n":"导航与全局","d":"顶栏、设置、搜索","items":[{"id":"i-today","g":"nav","vb":"0 0 24 24","n":"每日行事"},{"id":"i-library","g":"nav","vb":"0 0 24 24","n":"思维模型库"},{"id":"i-settings","g":"nav","vb":"0 0 24 24","n":"设置"},{"id":"i-theme","g":"nav","vb":"0 0 24 24","n":"主题切换"},{"id":"i-search","g":"nav","vb":"0 0 24 24","n":"搜索"},{"id":"i-close","g":"nav","vb":"0 0 24 24","n":"关闭"}]},{"k":"act","n":"通用操作","d":"增删改、导入导出、交付标准","items":[{"id":"i-plus","g":"act","vb":"0 0 24 24","n":"新增"},{"id":"i-trash","g":"act","vb":"0 0 24 24","n":"删除"},{"id":"i-drag","g":"act","vb":"0 0 24 24","n":"拖动把手"},{"id":"i-check","g":"act","vb":"0 0 24 24","n":"完成"},{"id":"i-copy","g":"act","vb":"0 0 24 24","n":"复制"},{"id":"i-download","g":"act","vb":"0 0 24 24","n":"导出"},{"id":"i-upload","g":"act","vb":"0 0 24 24","n":"导入"},{"id":"i-chevron","g":"act","vb":"0 0 24 24","n":"展开 / 收起"},{"id":"i-expand","g":"act","vb":"0 0 24 24","n":"全屏展开"},{"id":"i-flag","g":"act","vb":"0 0 24 24","n":"交付标准"},{"id":"i-timer","g":"act","vb":"0 0 24 24","n":"时限"},{"id":"i-spark","g":"act","vb":"0 0 24 24","n":"还有别的选法"}]},{"k":"state","n":"状态与提示","d":"警告、达标、未解锁","items":[{"id":"i-warn","g":"state","vb":"0 0 24 24","n":"提醒 / 超载"},{"id":"i-info","g":"state","vb":"0 0 24 24","n":"说明"},{"id":"i-ok","g":"state","vb":"0 0 24 24","n":"已达标"},{"id":"i-lock","g":"state","vb":"0 0 24 24","n":"未解锁"}]},{"k":"art","n":"插画","d":"三步主视觉 + 三个空状态，200×140","items":[{"id":"a-amp","g":"art","vb":"0 0 200 140","n":"放大器 · 品牌徽标"},{"id":"a-step1","g":"art","vb":"0 0 200 140","n":"逐层拆解 · 积木塔"},{"id":"a-step2","g":"art","vb":"0 0 200 140","n":"优先级 · 拖进象限"},{"id":"a-step3","g":"art","vb":"0 0 200 140","n":"今日时间块 · 时间轴"},{"id":"a-empty-goals","g":"art","vb":"0 0 200 140","n":"空状态 · 还没有拆解卡"},{"id":"a-empty-quad","g":"art","vb":"0 0 200 140","n":"空状态 · 象限还空着"},{"id":"a-empty-timeline","g":"art","vb":"0 0 200 140","n":"空状态 · 时间轴还空着"}]}];
var PRESET = {
  light:{ brand:["#4a5bd8","#1f9fb8"], mono:["#79839b","#79839b"], ink:["#1b2440","#1b2440"] },
  dark: { brand:["#8b9bff","#3ad3e8"], mono:["#7d8aa8","#7d8aa8"], ink:["#e9eeff","#e9eeff"] }
};
var S = 24, MODE = "brand", THEME = "light";
var themeBtn = document.getElementById("themeBtn");

function paint(){
  var c = PRESET[THEME][MODE];
  document.documentElement.style.setProperty("--acc", c[0]);
  document.documentElement.style.setProperty("--acc2", c[1]);
  document.documentElement.setAttribute("data-theme", THEME);
  themeBtn.textContent = THEME === "light" ? "深色" : "浅色";
}

function iconSvg(id, size, vb){
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="' + vb +
         '" fill="none"><use href="#' + id + '"/></svg>';
}
function artSvg(id, vb){
  return '<svg class="art" viewBox="' + vb + '" fill="none"><use href="#' + id + '"/></svg>';
}

function render(){
  var q = (document.getElementById("q").value || "").trim().toLowerCase();
  var host = document.getElementById("body");
  var html = "";
  MANIFEST.forEach(function(g){
    var list = g.items.filter(function(i){
      return !q || i.n.toLowerCase().indexOf(q) >= 0 || i.id.toLowerCase().indexOf(q) >= 0;
    });
    if(!list.length) return;
    var isArt = g.k === "art";
    html += '<section><div class="secTop"><h2>' + g.n + '</h2><span class="cnt">' +
            list.length + '</span><em>' + g.d + '</em></div>';
    if(isArt) html += '<p class="secDesc">可直接放进空状态或步骤页头；虚线部分是「还没发生」的意思。</p>';
    html += '<div class="grid' + (isArt ? ' art' : '') + '">';
    list.forEach(function(i){
      html += '<div class="cell' + (isArt ? ' art' : '') + '" data-id="' + i.id + '" data-vb="' + i.vb + '">' +
              (isArt ? artSvg(i.id, i.vb) : iconSvg(i.id, S, i.vb)) +
              '<div class="nm">' + i.n + '</div><div class="id">' + i.id + '</div></div>';
    });
    html += '</div></section>';
  });
  if(!html) html = '<div class="empty">没有匹配「' + q + '」的图形</div>';
  host.innerHTML = html;
}

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("on"); }, 1600);
}
function copy(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("已复制 " + text.slice(0,26) + "…"); },
        function(){ fallback(); });
    } else fallback();
  }catch(e){ fallback(); }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制失败，请手动选取"); }
    document.body.removeChild(ta);
  }
}

document.getElementById("body").addEventListener("click", function(e){
  var cell = e.target.closest ? e.target.closest(".cell") : null;
  if(!cell) return;
  var id = cell.getAttribute("data-id"), vb = cell.getAttribute("data-vb");
  var isArt = vb.indexOf("200 140") >= 0;
  var w = isArt ? 200 : 24;
  copy('<svg width="' + w + '" height="' + (isArt ? 140 : w) + '" viewBox="' + vb +
       '" fill="none"><use href="icons.svg#' + id + '"/></svg>');
});

document.getElementById("q").addEventListener("input", render);

document.getElementById("sizeSeg").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  S = parseInt(b.getAttribute("data-s"), 10);
  [].forEach.call(this.querySelectorAll("button"), function(x){ x.classList.remove("on"); });
  b.classList.add("on"); render();
});
document.getElementById("modeSeg").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  MODE = b.getAttribute("data-m");
  [].forEach.call(this.querySelectorAll("button"), function(x){ x.classList.remove("on"); });
  b.classList.add("on"); paint();
});
themeBtn.addEventListener("click", function(){ THEME = THEME === "light" ? "dark" : "light"; paint(); });

document.getElementById("dlBtn").addEventListener("click", function(){
  var node = document.getElementById("sprite").cloneNode(true);
  node.removeAttribute("style"); node.removeAttribute("id");
  node.removeAttribute("width"); node.removeAttribute("height"); node.removeAttribute("aria-hidden");
  var src = '<?xml version="1.0" encoding="UTF-8"?>\n' + node.outerHTML;
  var blob = new Blob([src], {type:"image/svg+xml;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "icons.svg";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  toast("icons.svg 已开始下载");
});

paint(); render();
</script>
</body>
</html>
