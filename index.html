<style>
/* ============================================================
   自律放大器 · 视觉层 v3
   参考 zenofthinking.com/zh/tools 的目录式卡片与 ai-bot.cn 的分类导航
   —— 干净基底、细描边、卡片网格、明确层级、克制渐变
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --r:16px; --r2:12px; --r3:9px;
  --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --q1:#c94f3d; --q2:#0f766e; --q3:#b07d18; --q4:#8d8578;
  --ok:#0f9966; --warn:#b07d18; --bad:#c94f3d;
  --lv0:#bc5c1a; --lv1:#c9752c; --lv2:#c99a35; --lv3:#96962f; --lv4:#5f9440;
}
html[data-theme="light"]{
  --bg:#faf8f5;
  --surface:#ffffff; --surface2:#fdfcfa; --sunken:#f4f0ea;
  --ink:#1c1917; --ink2:#57534e; --mute:#a29c92;
  --line:#eae4db; --lineS:#f2eee7;
  --acc:#c05e1a; --acc2:#0f766e; --accHi:#e08a3c; --accW:#faeedd; --accInk:#9a4a12;
  --sh:0 1px 2px rgba(41,32,24,.05);
  --sh2:0 10px 30px -14px rgba(41,32,24,.22);
  --shH:0 2px 4px rgba(41,32,24,.06),0 20px 40px -20px rgba(41,32,24,.30);
  --field:#ffffff; --fieldB:#e5dfd4;
  --axc:#a8a094;
  /* 时间轨色块：同屏必不同色，重叠的块一定分到不同色 */
  --c1:#c9622a; --c1k:#fff; --c2:#137a70; --c2k:#fff; --c3:#9a7318; --c3k:#fff;
  --c4:#6d4fc4; --c4k:#fff; --c5:#2f6fb0; --c5k:#fff; --c6:#b8437a; --c6k:#fff;
  --t1:#fbeae6; --t2:#e6f2ee; --t3:#faf1de; --t4:#f2efe9;
  --f1:#fbe0d7; --f2:#d8ece5; --f3:#f9e9c9; --f4:#ece9e1;
  --e1:#eec2b4; --e2:#b0d8ca; --e3:#ebd29b; --e4:#d9d4c7;
  --okW:#e6f4ec; --warnW:#faf1de; --badW:#fbeae6;
  --sheet:#ffffff;
  --mask:rgba(28,22,16,.42);
  /* 步骤条：已完成那格的柔橙（进度线与数字块共用） */
  --accS:#eccaa6;
}
html[data-theme="dark"]{
  --bg:#14100c;
  --surface:#1d1813; --surface2:#221d17; --sunken:#171310;
  --ink:#f1ece4; --ink2:#b8afa3; --mute:#8b8276;
  --line:#2f2820; --lineS:#252019;
  --acc:#e69055; --acc2:#3fbfae; --accHi:#f2b071; --accW:rgba(230,144,85,.13); --accInk:#f0a873;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 14px 34px -16px rgba(0,0,0,.7);
  --shH:0 2px 6px rgba(0,0,0,.5),0 24px 46px -22px rgba(0,0,0,.8);
  --field:#171310; --fieldB:#2c261e;
  --axc:#453e34;
  --c1:#e09050; --c1k:#1c1206; --c2:#3fbfae; --c2k:#06201c; --c3:#d4a53f; --c3k:#1f1605;
  --c4:#a78bfa; --c4k:#150c2b; --c5:#6aa9e0; --c5k:#07192b; --c6:#e88ab6; --c6k:#2b0a1a;
  --t1:rgba(201,79,61,.14); --t2:rgba(63,191,174,.11); --t3:rgba(176,125,24,.13); --t4:rgba(139,130,118,.10);
  --f1:rgba(201,79,61,.20); --f2:rgba(63,191,174,.16); --f3:rgba(203,158,58,.18); --f4:rgba(150,140,125,.13);
  --e1:rgba(201,79,61,.44); --e2:rgba(63,191,174,.36); --e3:rgba(203,158,58,.40); --e4:rgba(150,140,125,.28);
  --okW:rgba(15,153,102,.15); --warnW:rgba(176,125,24,.16); --badW:rgba(201,79,61,.15);
  --sheet:#1a1511;
  --mask:rgba(0,0,0,.62);
  --accS:rgba(230,144,85,.42);
  --lv0:#e69055; --lv1:#eda168; --lv2:#d9a94a; --lv3:#b3a94e; --lv4:#84a952;
}
/*TOKENS:START*/
html[data-theme="light"]{--i-bg:#f6e7d8; --i-bg2:#ffffff; --i-mid:#cbb59d; --i-mass:#2b2118; --i-mass2:#5c4a38; --i-line:#2b2118; --i-fill:#ffffff; --i-acc:#c05e1a; --i-acc2:#0f766e; --i-gold:#b07d18; --i-sh:rgba(41,32,24,.14);}
html[data-theme="dark"]{--i-bg:#241d16; --i-bg2:#2b231b; --i-mid:#6b5c4a; --i-mass:#f1ece4; --i-mass2:#d4cabd; --i-line:#d4cabd; --i-fill:#221d17; --i-acc:#e69055; --i-acc2:#3fbfae; --i-gold:#d9a94a; --i-sh:rgba(0,0,0,.5);}
/*TOKENS:END*/
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);color:var(--ink);line-height:1.62;
  background:var(--bg);min-height:100%;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:80;background:var(--surface);
  border-bottom:1px solid var(--line)}
.topbarIn{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;
  padding:11px 22px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none;color:inherit;cursor:pointer}
.logo{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.logo img{display:block;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 1px 1px rgba(41,32,24,.14))}
html[data-theme="dark"] .logo img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)) brightness(1.12)}
.brandTx{min-width:0}
.brandTx b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.brandTx span{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tAct{display:flex;gap:8px;align-items:center;margin-left:auto}

/* ---------- tab 导航（ai-bot 风格横向类目） ---------- */
.tabs{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;gap:4px;align-items:center;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:none;background:transparent;font:inherit;font-size:13.5px;font-weight:700;
  color:var(--ink2);padding:11px 14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;
  border-bottom:2px solid transparent;transition:.18s}
.tab:hover{color:var(--accInk)}
.tab.on{color:var(--accInk);border-bottom-color:var(--acc)}
.tab .n{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--mute);
  background:var(--sunken);border:1px solid var(--lineS);padding:1px 6px;border-radius:20px}
.tab.on .n{color:#fff;background:var(--acc);border-color:transparent}
.navbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:70}

/* ---------- hero（首页总览） ---------- */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.heroIn{max-width:1180px;margin:0 auto;padding:44px 22px 38px}
.heroKick{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accInk);font-weight:700}
.hero h1{font-size:clamp(26px,3.6vw,38px);font-weight:800;letter-spacing:-.024em;line-height:1.22;margin:12px 0 14px;max-width:22ch}
.heroLede{font-size:14.5px;color:var(--ink2);max-width:64ch}

/* ---------- 区块标题（目录式） ---------- */
.secBar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin:34px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.secBar h2{font-size:19px;font-weight:800;letter-spacing:-.018em;display:flex;align-items:center;gap:9px}
.secBar .hint{font-size:12.5px;color:var(--mute)}
.secBar .more{font-size:12.5px;font-weight:700;color:var(--accInk);background:none;border:none;
  cursor:pointer;font-family:inherit}
.secBar .more:hover{text-decoration:underline}

/* ---------- 工具卡片网格 ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;
  padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:var(--shH)}
.tileIco{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--accW);color:var(--accInk);border:1px solid var(--lineS)}
.tileIco .ico{width:24px;height:24px}
.tileName{font-size:15.5px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tileName .tagx{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mute);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.tileDesc{font-size:13px;color:var(--ink2);line-height:1.66}
.tileList{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:2px}
.tileList li{font-size:12.5px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start;line-height:1.55}
.tileList li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--acc);
  margin-top:7px;opacity:.7}
.tileGo{margin-top:auto;padding-top:12px;border-top:1px solid var(--lineS);
  font-size:12.5px;font-weight:700;color:var(--accInk);display:flex;align-items:center;gap:6px}
.tileGo .arw{transition:transform .2s}
.tile:hover .tileGo .arw{transform:translateX(4px)}

/* ---------- 通用控件 ---------- */
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;transition:.16s;
  white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--accInk);background:var(--accW)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--accHi));border-color:transparent;color:#fff;
  box-shadow:0 8px 18px -10px var(--acc)}
.btn.pri:hover{filter:brightness(1.07);color:#fff}
.btn.gh{background:transparent}
.btn.sm{font-size:12px;padding:5px 10px;border-radius:7px}
.iconBtn{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;
  height:34px;padding:0 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;transition:.16s}
.iconBtn:hover{border-color:var(--acc);color:var(--accInk);background:var(--accW)}
.iconBtn .ico{width:15px;height:15px}
.xbtn{flex:none;border:none;background:transparent;color:var(--mute);cursor:pointer;font-size:15px;
  line-height:1;padding:3px 6px;border-radius:6px;transition:.15s}
.xbtn:hover{background:var(--badW);color:var(--bad)}

input[type=text],input[type=time],input[type=number],textarea,select{
  width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--field);
  border:1px solid var(--fieldB);border-radius:9px;padding:9px 11px;outline:none;transition:.16s;
  font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accW)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.85}
textarea{resize:vertical;min-height:60px;line-height:1.62}
.fl{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.fl i{font-style:normal;font-weight:400;color:var(--mute);margin-left:6px;font-size:12px}
.fl:first-child{margin-top:0}

/* ---------- 布局 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 96px}
.secHead{padding:30px 0 8px}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accInk);font-weight:700}
h1.t{font-size:clamp(23px,3vw,30px);font-weight:800;letter-spacing:-.024em;line-height:1.24;margin:10px 0 10px}
h2.t{font-size:17px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h2.t .h2x{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
h3.t{font-size:14.5px;font-weight:800;letter-spacing:-.012em;display:flex;align-items:center;gap:8px}
h3.t::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--accHi))}
.lede{font-size:13.5px;color:var(--ink2);max-width:70ch}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--accW);
  color:var(--accInk);border:1px solid var(--lineS);white-space:nowrap}
.tag.ok{background:var(--okW);color:var(--ok)}
.tag.warn{background:var(--warnW);color:var(--warn)}
.tag.bad{background:var(--badW);color:var(--bad)}
.tag.gray{background:var(--sunken);color:var(--ink2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:20px;margin-bottom:14px;position:relative}
.cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.card .sub{font-size:12.5px;color:var(--mute);margin-top:5px}
.note{border-radius:0 var(--r2) var(--r2) 0;padding:11px 14px;font-size:12.5px;line-height:1.66;
  border-left:3px solid var(--acc);background:var(--accW);color:var(--accInk);margin-top:14px}
.note.w{border-left-color:var(--warn);background:var(--warnW);color:var(--warn)}
.note.b{border-left-color:var(--bad);background:var(--badW);color:var(--bad)}
.note.g{border-left-color:var(--ok);background:var(--okW);color:var(--ok)}
.note b{font-weight:800}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:34px 16px;
  border:1px dashed var(--line);border-radius:var(--r2);background:var(--surface2)}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:6px}
.empty .ico{color:var(--line);width:34px;height:34px;margin-bottom:8px}

/* ---------- 步骤导航（stepper） ----------
   扁平步进：没有卡片描边、没有白底（用户明确不喜欢那样）。
   三态靠「数字色块 + 底部一条进度线」表达，靠 hover 的浅色水洗暗示可点。
   底色只留给 hover / 当前步，其余全是留白。 */
.seg{position:relative;display:flex;align-items:stretch;gap:26px;padding:0;background:transparent;
  border:none;margin:38px 0 20px}
.segInd{display:none}
/* i-arrow 的描边是橙色渐变（stroke:url(#ga)），不吃 color —— 所以强弱只能靠
   不透明度 / 尺寸区分：卡间箭头一律是装饰性淡箭头，只有「指向下一步」那个拉满。 */
.segArrow{flex:none;align-self:center;display:flex;opacity:.3;margin:0 -6px}
.segArrow .ico{width:14px;height:14px}
.segBtn{flex:1;min-width:0;position:relative;font:inherit;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  padding:16px 18px 24px;border-radius:12px;
  background:transparent;border:0;box-shadow:none;color:var(--ink2);
  transition:background .2s}
.segBtn:hover{background:var(--sunken)}
.segBtn:active{background:var(--sunken)}
.segBtn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
/* 底部那条进度线：未到=浅灰 / 已完成=柔橙 / 当前=实橙 */
.segBtn::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:3px;
  border-radius:3px;background:var(--line);transition:background .25s}
.segBtn .sno{flex:none;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11.5px;font-weight:800;background:var(--sunken);color:var(--mute);
  border:0;transition:.2s}
.segBtn .sw{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.segBtn .sn{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;opacity:.75;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segBtn .sc{font-family:var(--font);font-size:10.5px;letter-spacing:0;opacity:.9;margin-left:5px}
.segBtn .sb{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.segBtn .stx{display:flex;align-items:center;gap:13px;min-width:0;flex:1}
.segBtn .ico{width:22px;height:22px;color:var(--mute);flex:none;opacity:.8}

/* ① 已完成：柔橙数字块 + 柔橙进度线（不再打勾，用户不喜欢） */
.segBtn.done .sno{background:var(--accW);color:var(--accInk)}
.segBtn.done::after{background:var(--accS)}
.segBtn.done .sb{color:var(--ink2)}

/* ② 当前步：实橙数字块 + 实橙进度线 + 深色标题，一眼看出「你在这」 */
.segBtn.on .sno{background:linear-gradient(135deg,var(--acc),var(--accHi));color:#fff}
.segBtn.on::after{background:var(--acc)}
.segBtn.on .sb{color:var(--ink);font-weight:800}
.segBtn.on .sn{opacity:.95;color:var(--accInk)}
.segBtn.on .ico{color:var(--accInk);opacity:1}
.segBtn.on:hover{background:var(--accW)}

/* ③ 下一步：标题提亮；「指向它的那一个流程箭头」转橙 + 轻轻推动，
   把「该点哪」指出来。只保留这一个箭头 —— 按钮里再放一个会和它并排成「→ →」。 */
.segBtn.next .sb{color:var(--ink)}
.segBtn.next:hover{background:var(--sunken)}
.segArrow.act{opacity:1}
.segArrow.act .ico{width:17px;height:17px}
@keyframes sgoNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.segArrow.act{animation:sgoNudge 1.9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.segArrow.act{animation:none}}

/* 步骤条下面那行指路文字 */
.segHint{display:flex;align-items:center;gap:7px;font-size:12.2px;color:var(--mute);
  margin:0 0 32px;padding-left:4px;line-height:1.5}
.segHint .ico{width:15px;height:15px;flex:none;color:var(--accInk)}
.segHint b{color:var(--accInk);font-weight:800}
.segHint .sgN{display:none}
/* 中等宽度（721–820）：三格横排时那行小字塞不下「· 还剩 N 个」，
   与其显示省略号，不如先收起计数（≥721 才需要收，窄屏已改竖排、放得下）。 */
@media (min-width:721px) and (max-width:820px){.segBtn .sc{display:none}}
.mainNav{display:none}

/* ---------- 分幕滑动 ---------- */
.pane{display:none}
.pane.on{display:block;animation:paneIn .34s cubic-bezier(.22,.85,.28,1)}
.pane.on.rev{animation-name:paneInRev}
@keyframes paneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes paneInRev{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ---------- 教练提示 ---------- */
.coach{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:var(--r2);
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);margin:20px 0 14px;flex-wrap:wrap}
.coach .ci{flex:1;min-width:240px}
.coach .ct{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--accInk);font-weight:700;
  display:flex;align-items:center;gap:7px}
.coach ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:7px}
.coach li{display:flex;gap:9px;font-size:12.8px;line-height:1.6;align-items:flex-start;cursor:pointer;
  padding:9px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--lineS);transition:.16s}
.coach li:hover{border-color:var(--acc);background:var(--accW)}
.coach .bul{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--acc)}
.coach li.w .bul{background:var(--warn)}
.coach li.b .bul{background:var(--bad)}
.coach li.g .bul{background:var(--ok)}
.coach li .go{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:none;padding-left:8px}
.cMore{font:inherit;font-size:12px;font-weight:700;color:var(--accInk);background:none;border:none;
  cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
/* ---------- 乐高塔 ---------- */
.goal{padding:18px 20px 20px}
.goalHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.goalNo{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accInk);
  background:var(--accW);border:1px solid var(--lineS);padding:2px 8px;border-radius:6px}
.goalR{margin-left:auto;display:flex;align-items:center;gap:10px}
.towerBar{display:inline-flex;gap:3px}
.towerBar i{width:14px;height:5px;border-radius:2px;background:var(--line);transition:.3s}
.towerBar i.on{background:linear-gradient(90deg,var(--acc),var(--accHi))}
.towerBar i.cur{background:var(--acc);opacity:.5;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.14}}
.goalPct{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-weight:700}

.tower{position:relative;padding-left:26px}
.tower::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--lv0),var(--lv1) 28%,var(--lv2) 52%,var(--lv3) 76%,var(--lv4));opacity:.26}
.brick{position:relative;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface2);
  margin-bottom:9px;border-left:3px solid var(--lv);transition:border-color .22s,box-shadow .22s,opacity .3s}
.brick::before{content:"";position:absolute;left:-23px;top:17px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line);transition:.24s;z-index:2}
.brick.open{border-color:var(--line);box-shadow:var(--sh2)}
.brick.open::before{border-color:var(--lv);background:var(--lv);box-shadow:0 0 0 4px var(--accW)}
.brick.hidden{display:none}
.brick.collapsed{opacity:.9}
.brick.collapsed .brickBody{display:none}
.brick.collapsed .brickEcho{display:block}
.brick.locked{opacity:.4;filter:grayscale(.4)}
.brick.locked .brickBody,.brick.locked .brickEcho{display:none}
.brickHead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.brickNo{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--lv)}
.brickName{font-size:13.3px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bDot{flex:none;font-size:11px;color:var(--mute);font-family:var(--mono)}
.bDot.done{color:var(--ok)}
.bDot.cur{color:var(--acc)}
.brickBody{padding:0 13px 13px;animation:unfold .3s cubic-bezier(.22,.85,.28,1)}
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.brickQ{font-size:12.6px;color:var(--ink2);line-height:1.6;margin-bottom:9px;
  padding-left:10px;border-left:2px solid var(--line)}
.brickBody textarea{min-height:56px}
.brickEcho{display:none;padding:0 13px 11px;font-size:12.4px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.tip{margin-top:9px}
details.tip summary{font-size:11.8px;color:var(--mute);cursor:pointer;list-style:none;font-weight:700}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::before{content:"▸ ";}
details.tip[open] summary::before{content:"▾ ";}
details.tip div{font-size:12.2px;color:var(--mute);line-height:1.66;margin-top:6px;
  padding-left:10px;border-left:2px solid var(--lineS)}
.brickActs{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}

/* ---------- 四象限 ---------- */
.pool{border-radius:var(--r2);border:1px dashed var(--fieldB);background:var(--surface2);padding:14px;
  margin-bottom:18px;transition:.2s}
.pool.over{border-color:var(--acc);border-style:solid;box-shadow:0 0 0 3px var(--accW)}
.poolHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.poolHead .pt{font-size:13px;font-weight:800}
.poolHead .pn{font-family:var(--mono);font-size:11px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:7px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;transition:.14s}
.chip:hover{border-color:var(--acc);transform:translateY(-1px)}
.chip.sel{border-color:var(--acc);background:var(--accW);box-shadow:0 0 0 3px var(--accW)}
.chip.dragging{opacity:.32}
.chip .ct{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cw{flex:none;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.chip .cx{flex:none;border:none;background:transparent;color:var(--mute);cursor:pointer;font-size:13px;
  line-height:1;padding:0 1px;border-radius:4px}
.chip .cx:hover{background:var(--badW);color:var(--bad)}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.03);
  background:linear-gradient(135deg,var(--acc),var(--accHi));color:#fff;border-color:transparent;
  box-shadow:0 18px 38px -14px rgba(0,0,0,.45);opacity:.97;cursor:grabbing}
.quickAdd{display:flex;gap:8px;margin-top:12px}
.quickAdd input{flex:1}

.mxGrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 30px 24px}
.axLayer{position:absolute;inset:0;z-index:4;pointer-events:none}
.axV{position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--axc) 10%,var(--axc) 90%,transparent);opacity:.75}
.axH{position:absolute;top:50%;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--axc) 10%,var(--axc) 90%,transparent);opacity:.75}
.axV .ah{position:absolute;top:-1px;left:-4.5px;width:0;height:0;
  border:5px solid transparent;border-bottom-color:var(--axc)}
.axH .ah{position:absolute;right:-1px;top:-4.5px;width:0;height:0;
  border:5px solid transparent;border-left-color:var(--axc)}
.axV .tk{position:absolute;left:-3px;width:7px;height:1px;background:var(--axc);opacity:.5}
.axH .tk{position:absolute;top:-3px;height:7px;width:1px;background:var(--axc);opacity:.5}
.axNode{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  background:var(--surface);border:1.5px solid var(--axc);transform:rotate(45deg);border-radius:2px}
.axTitleY{position:absolute;left:-22px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
.axTitleX{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}

.qz{position:relative;border-radius:var(--r2);border:1px solid var(--qe);min-height:158px;padding:15px;
  background:var(--qf);transition:.2s;
  display:flex;flex-direction:column;gap:10px}
.qz .cnr{position:absolute;width:12px;height:12px;border:1.5px solid var(--qc);opacity:.55}
.qz .cnr.a{top:7px;left:7px;border-right:none;border-bottom:none;border-radius:5px 0 0 0}
.qz .cnr.b{bottom:7px;right:7px;border-left:none;border-top:none;border-radius:0 0 5px 0}
.qz .qzTop{display:flex;align-items:center;gap:9px}
.qz .qzId{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--qc);
  border:1px solid var(--qc);border-radius:6px;padding:1px 6px;opacity:.9}
.qz .qzName{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.qz .qzN{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
.qz .qzSub{font-size:11.8px;color:var(--mute);line-height:1.5}
.qz .qzBody{display:flex;flex-direction:column;gap:7px;flex:1}
.qz .qEmpty{font-size:12px;color:var(--ink2);border:1px dashed var(--qe);border-radius:9px;
  padding:16px 10px;text-align:center;background:transparent}
.qz.over{border-color:var(--qc);box-shadow:0 0 0 3px var(--accW)}
.qz.armed{cursor:pointer}
.qz.armed .qEmpty{border-color:var(--acc);color:var(--accInk)}

/* ---------- 时间轴 ---------- */
.loadCard{padding:18px 20px}
.loadTop{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.loadBig{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.loadBig.bad{color:var(--bad)}
.loadR{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:7px}
.loadR input{width:78px;padding:6px 9px;font-size:12.5px}
.bar{height:8px;border-radius:20px;background:var(--sunken);overflow:hidden;margin:14px 0 10px;display:flex}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--accHi));transition:width .35s}
.bar i.bad{background:linear-gradient(90deg,var(--bad),var(--warn))}
.railScroll{overflow-x:auto;overflow-y:hidden;margin:6px -4px 0;padding:4px;scrollbar-width:thin}
.rail{position:relative;min-width:560px}
.railAx{position:absolute;left:0;right:0;top:20px;height:1px;background:var(--line)}
.railAx i{position:absolute;top:0;width:1px;height:6px;background:var(--line)}
.railAx i b{position:absolute;top:9px;left:0;transform:translateX(-50%);
  font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.railBlk{position:absolute;border-radius:8px;overflow:hidden;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;
  border:1px solid rgba(0,0,0,.13);transition:transform .18s,box-shadow .18s}
.railBlk .rt{font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:800;
  opacity:.75;flex:none;letter-spacing:-.02em}
.railBlk:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.railBlk.c1{background:var(--c1);color:var(--c1k)}
.railBlk.c2{background:var(--c2);color:var(--c2k)}
.railBlk.c3{background:var(--c3);color:var(--c3k)}
.railBlk.c4{background:var(--c4);color:var(--c4k)}
.railBlk.c5{background:var(--c5);color:var(--c5k)}
.railBlk.c6{background:var(--c6);color:var(--c6k)}
.railNote{position:absolute;left:0;top:46px;font-size:11px;color:var(--mute)}
.railRange{position:absolute;left:0;top:0;font-size:10.5px;font-weight:700;color:var(--mute);
  font-family:var(--mono);letter-spacing:.2px}
.railHint{margin-top:9px;font-size:11.5px;line-height:1.55;color:var(--mute)}
.railHint b{color:var(--accInk)}

/* ---------- 任务卡 ---------- */
.task{border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);margin-bottom:9px;
  transition:.2s;overflow:hidden}
.task.open{border-color:var(--acc);box-shadow:var(--sh2)}
.taskHead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.taskTime{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accInk);
  background:var(--accW);border:1px solid var(--lineS);padding:2px 8px;border-radius:6px;flex:none}
.taskTx{flex:1;min-width:0;font-size:13.3px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .taskTx{color:var(--mute);text-decoration:line-through}
.taskMins{font-family:var(--mono);font-size:11px;color:var(--mute);flex:none}
.taskFlags{display:inline-flex;gap:6px;flex:none;align-items:center}
.ck{flex:none;display:flex;align-items:center}
.ck input{appearance:none;-webkit-appearance:none;width:19px;height:19px;border-radius:6px;
  border:1.5px solid var(--fieldB);background:var(--surface);cursor:pointer;position:relative;transition:.16s;margin:0}
.ck input:checked{background:linear-gradient(135deg,var(--acc),var(--accHi));border-color:transparent}
.ck input:checked::after{content:"";position:absolute;left:6px;top:2.5px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.taskBody{padding:0 13px 13px;display:none;animation:unfold .3s cubic-bezier(.22,.85,.28,1)}
.task.open .taskBody{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- 思维模型库：图片背景卡 ---------- */
.catCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:16px;margin-top:2px}
.catCard{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  min-height:218px;padding:16px;border-radius:var(--r);cursor:pointer;overflow:hidden;
  background-size:cover;background-position:center;
  /* 不要描边：图片顶部本来就亮，再压一层 12% 黑边会变成一条明显的「上边缘黑线」。
     用投影拉开卡片与底色的层次，边缘靠 ::after 的白色内描边收口。 */
  border:0;color:#fff;box-shadow:var(--sh2);
  transition:transform .22s cubic-bezier(.22,.85,.28,1),box-shadow .22s}
.catCard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.catCard:hover{transform:translateY(-3px);box-shadow:var(--shH)}
.catCard.open{box-shadow:0 0 0 2px var(--acc),var(--shH)}
.catCard>*{position:relative;z-index:1}
.ccTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ccNo{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.14em;
  color:rgba(255,255,255,.78);padding-top:3px}
.ccIco{flex:none;width:31px;height:31px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.26)}
.ccIco .ico{width:17px;height:17px;color:#fff}
.ccBody{display:block}
.ccBody h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em;color:#fff;
  text-shadow:0 1px 12px rgba(0,0,0,.4)}
.ccBody p{margin:4px 0 11px;font-size:12.4px;line-height:1.55;color:rgba(255,255,255,.82)}
.ccModel{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.30)}
.ccModel i{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:600;opacity:.82}
.ccState{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;
  font-size:11px;color:rgba(255,255,255,.76)}
.ccState em{font-style:normal;font-weight:700;color:#fff;display:inline-flex;align-items:center;gap:4px}
.ccState em b{transition:transform .2s}
.catCard:hover .ccState em b{transform:translateX(3px)}
.catPanel{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:18px 20px;box-shadow:var(--sh2);animation:unfold .3s cubic-bezier(.22,.85,.28,1)}
.cpHead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cpTx{min-width:0}
.cpHead h3{margin:4px 0 6px;font-size:19px;font-weight:800;letter-spacing:-.015em}
.cpCore{margin:0;font-size:13.4px;color:var(--ink2)}
.cpWhen{margin:7px 0 0;font-size:12.4px;color:var(--mute)}
.cpWhen b{color:var(--ink2);margin-right:7px}
.cpProg{flex:none;font-family:var(--mono);font-size:20px;font-weight:800;color:var(--accInk);
  display:flex;align-items:baseline}
.cpProg span{font-family:var(--font);font-size:11px;font-weight:600;color:var(--mute);margin-left:5px}
.cpSteps{margin-top:16px}
.catPanel .sheetActs{position:static;bottom:auto;background:none;padding-top:0;margin-top:16px}
.catArrow{flex:none;font-size:12px;color:var(--mute);transition:transform .3s}
.stepBlk.open .catArrow{transform:rotate(90deg)}

/* ---------- 模态 / 抽屉 ---------- */
.mask{position:fixed;inset:0;z-index:200;background:var(--mask);
  display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mask.mid{align-items:center;padding:20px}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--sheet);
  border:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--sh2);
  padding:22px 22px 30px;animation:slideUp .3s cubic-bezier(.22,.85,.28,1)}
.mask.mid .sheet{border-radius:18px;animation:popIn .24s cubic-bezier(.22,.85,.28,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheetHead{position:sticky;top:-22px;background:var(--sheet);padding:6px 0 13px;margin-bottom:6px;
  border-bottom:1px solid var(--line);z-index:3}
.sheetHead h3{font-size:18px;font-weight:800;letter-spacing:-.018em;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap}
.sheetHead .core{font-size:13px;color:var(--ink2);margin-top:6px}
.sheetHead .when{font-size:12.2px;color:var(--mute);margin-top:5px}
.sheetActs{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;position:sticky;bottom:-30px;
  background:var(--sheet);padding:12px 0 4px;border-top:1px solid var(--line)}
.stepBlk{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);margin-bottom:9px;
  overflow:hidden}
.stepBlk.open{border-color:var(--acc);background:var(--surface)}
.stepHead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.stepNo{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:800;background:var(--sunken);color:var(--ink2);
  border:1px solid var(--lineS)}
.stepBlk.filled .stepNo{background:linear-gradient(135deg,var(--acc),var(--accHi));color:#fff;border-color:transparent}
.stepTx{flex:1;min-width:0}
.stepTx b{display:block;font-size:13px;font-weight:700}
.stepTx span{display:block;font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepBody{display:none;padding:0 13px 13px}
.stepBlk.open .stepBody{display:block;animation:unfold .28s cubic-bezier(.22,.85,.28,1)}
.progRing{display:flex;align-items:center;gap:10px;margin-top:12px}
.progTrack{flex:1;height:6px;border-radius:20px;background:var(--sunken);overflow:hidden}
.progTrack i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--accHi));transition:width .35s}
.progTx{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-weight:700}

/* ---------- 吐司 ---------- */
#toastHost{position:fixed;left:0;right:0;bottom:22px;z-index:400;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{max-width:min(560px,92vw);padding:11px 17px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--sheet);border:1px solid var(--line);box-shadow:var(--sh2);color:var(--ink);
  animation:toastIn .26s cubic-bezier(.22,.85,.28,1)}
.toast.out{animation:toastOut .4s ease forwards}
.toast.g{border-color:var(--ok);color:var(--ok)}
.toast.b{border-color:var(--bad);color:var(--bad)}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(10px);opacity:0}}
.foot{text-align:center;color:var(--mute);font-size:11.5px;margin-top:36px;line-height:1.95}
.foot b{color:var(--ink2)}

/* ---------- 图标 ---------- */
.ico{flex:none;display:inline-block;width:18px;height:18px;vertical-align:-3px}
.ico.xs{width:13px;height:13px;vertical-align:-2px}
.ico.s{width:15px;height:15px;vertical-align:-2px}
.ico.l{width:22px;height:22px}
.ico.xl{width:30px;height:30px}
.btn.pri .ico{filter:brightness(0) invert(1)}
.iconBtn .ico{width:15px;height:15px}
.btn .ico{margin-right:5px;vertical-align:-3px}
.brickIco{flex:none;display:flex;color:var(--lv)}
.chip .grip{opacity:.35;margin-right:-4px}

/* ---------- 响应式 ---------- */
/* ---------- 插画位 ---------- */
.secGrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 30px;align-items:center}
.paneArt{width:236px;margin:0 8px 4px 0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--sh2);transform:rotate(1.8deg);transition:transform .35s;background:var(--surface2)}
.paneArt:hover{transform:rotate(0)}
.paneArt img{display:block;width:100%;height:auto}
.heroGrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 40px;align-items:center}
.heroArt{margin:0;width:min(330px,32vw);border-radius:18px;overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--sh2);position:relative;background:var(--surface2)}
.heroArt img{display:block;width:100%;height:auto}
.heroArt figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 10px;font-size:11px;
  font-family:var(--mono);letter-spacing:.1em;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(15,12,8,.74))}
/* ---------- 图标效果增强 ---------- */
.tileIco{transition:background .25s,color .25s,box-shadow .25s}
.tile:hover .tileIco{background:linear-gradient(135deg,var(--acc),var(--accHi));color:#fff;
  border-color:transparent;box-shadow:0 6px 14px -6px rgba(192,94,26,.55)}
.cbtn .ico{transition:transform .2s}
.cbtn:hover .ico{transform:scale(1.15)}
.stepNo{transition:background .2s,color .2s}

@media(max-width:900px){
  .heroIn{padding:34px 18px 30px}
  .wrap{padding:0 16px 90px}
  .topbarIn{padding:11px 16px}
  .tabs{padding:0 16px}
  .brandTx span{display:none}
  .navbar{top:52px}
}
@media (max-width:720px){
  .paneArt{display:none}
  .heroGrid{grid-template-columns:1fr}
  .heroArt{display:none}
  .card{padding:16px;border-radius:14px}
  .secHead{padding:22px 0 6px}
  /* 窄屏把三格竖着摞起来，比「2+1 折行」好读，箭头也省掉 */
  .seg{flex-direction:column;gap:6px}
  .segArrow{display:none}
  /* 竖排时「点这里继续」那个箭头转成朝下，夹在当前步与下一步之间 */
  .segArrow.act{display:flex;align-self:center;margin:-2px 0;animation:none}
  .segArrow.act .ico{transform:rotate(90deg)}
  .segBtn{flex:none;width:100%}
  .segHint .sgW{display:none}
  .segHint .sgN{display:inline}
  .mxGrid{grid-template-columns:1fr 1fr;gap:10px;margin-left:18px}
  .qz{padding:11px;min-height:126px}
  .qz .qzSub{display:none}
  .qz .qzName{font-size:12.4px}
  .axTitleY{left:-17px;font-size:9px}
  .g2{grid-template-columns:1fr}
  .sheet{padding:18px 16px 26px;border-radius:18px 18px 0 0}
  .sheetHead{top:-18px}
  .catCards{grid-template-columns:1fr}
  .catCard{min-height:190px}
  .segBtn .sb{font-size:12px}
  .loadBig{font-size:23px}
}
@media (max-width:400px){
  .qz .qzId{display:none}
  .qz .qzName{font-size:11.8px}
  .brandTx b{font-size:14px}
}
</style>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function isObj(x){ return !!x && typeof x === "object" && !Array.isArray(x); }
function str(v){ return String(v == null ? "" : v); }
/* 折叠行只放一行，把换行和多余空白压掉，免得把卡片撑高 */
function oneLine(s){ return str(s).replace(/\s+/g, " ").trim(); }

function load(){

    var raw = localStorage.getItem(KEY);
    if(!raw) return null;
    return normalize(JSON.parse(stripBom(raw)));

function stripBom(s){ return s.charCodeAt(0) === 0xFEFF ? s.slice(1) : s; }

/* 类型不对就转换，只有结构性错误才丢——导入手改过的 JSON 时不能静默丢数据 */
function normalize(o){
  var d = blank();
  if(!isObj(o)) return d;
  var mins = function(v, dft){
    var n = (typeof v === "number") ? v : parseFloat(v);
    return (isFinite(n) && n >= 0) ? Math.round(n) : dft;
  };
  if(Array.isArray(o.goals)){
    d.goals = o.goals.filter(isObj).map(function(x){
      var op = parseInt(x.open, 10);
      return {
        id: x.id ? str(x.id) : uid(),
        text: str(x.text), basis: str(x.basis), sub: str(x.sub),
        cap: str(x.cap), act: str(x.act),
        quad: isQuad(x.quad) ? x.quad : null,
        open: (isFinite(op) && op >= 1 && op <= BRICKS.length) ? op : 1
      };
    });
  }
  if(Array.isArray(o.today)){
    d.today = o.today.filter(isObj).map(function(x){
      return {
        id: x.id ? str(x.id) : uid(),
        text: str(x.text), time: str(x.time),
        mins: mins(x.mins, 60),
        dod: str(x.dod), due: str(x.due),
        quad: isQuad(x.quad) ? x.quad : null,
        done: !!x.done
      };
    });
  }
  if(isObj(o.kb)){
    for(var k in o.kb){
      if(!Object.prototype.hasOwnProperty.call(o.kb, k)) continue;
      if(!kbById(k) || !isObj(o.kb[k])) continue;
      var cell = {}, raw = o.kb[k];
      for(var fk in raw){
        if(Object.prototype.hasOwnProperty.call(raw, fk)) cell[fk] = str(raw[fk]);
      }
      d.kb[k] = cell;
    }
  }
  d.avail = mins(o.avail, 480) || 480;
  d.theme = isTheme(o.theme) ? o.theme : d.theme;
  if(isObj(o.ui)){
    var u = o.ui;
    d.ui.tab  = (u.tab === "kb") ? "kb" : (u.tab === "home" ? "home" : "daily");
    var st = parseInt(u.step, 10);
    d.ui.step = (isFinite(st) && st >= 0 && st <= 2) ? st : 0;
    d.ui.dir  = (u.dir === -1) ? -1 : 1;
    d.ui.cat  = catById(str(u.cat)) ? str(u.cat) : null;
    d.ui.q    = str(u.q);
    d.ui.sel  = u.sel ? str(u.sel) : null;
    if(isObj(u.cats)) for(var c in u.cats){ if(u.cats[c]) d.ui.cats[c] = true; }
    if(isObj(u.eb))   for(var b in u.eb){ if(u.eb[b]) d.ui.eb[b] = true; }
    /* stepOpen 要保留 false（用户主动收起过的那一层），所以按布尔值原样存 */
    if(isObj(u.stepOpen)){
      for(var s2 in u.stepOpen){
        if(Object.prototype.hasOwnProperty.call(u.stepOpen, s2)){
          d.ui.stepOpen[s2] = (u.stepOpen[s2] === true);
        }
      }
    }
  }
  /* 选中的条目如果已经不存在，清掉，避免出现悬空状态 */
  if(d.ui.sel && !findById(d.goals, d.ui.sel)) d.ui.sel = null;
  return d;
}

function esc(s){

function num(v, dft){
  var n = typeof v === "number" ? v : parseFloat(v);

function minLabel(m){
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m/60), r = m % 60;
  if(h && r) return h + " 小时 " + r + " 分";
  if(h) return h + " 小时";
  return r + " 分";
}

function kbById(id){
  for(var i=0;i<KB.length;i++) if(KB[i].id === id) return KB[i];
  return null;
}
function catById(id){
  for(var i=0;i<CATS.length;i++) if(CATS[i].id === id) return CATS[i];
  return null;
}
function catName(id){ var c = catById(id); return c ? c.n : "未分类"; }
function findById(arr, id){
  for(var i=0;i<arr.length;i++) if(arr[i].id === id) return arr[i];
  return null;
}
function removeBy(arr, id){
  for(var i=arr.length-1;i>=0;i--) if(arr[i].id === id) arr.splice(i,1);

/* "HH:MM" → 当天分钟数；不是合法时间就返回 null */
function hhmm(t){
  var m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(str(t).trim());
  return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
}
function hm(m){ return Math.floor(m / 60) + ":" + pad(m % 60); }

/* 今日负载 = 实际被占用的时长。
   带「几点开始」的任务按时间区间求并集：重叠时段只算一次。
   两条 2:00–3:00 与 2:30–3:30 的任务，占用是 90 分钟，不是 120 分钟。
   没填时间的任务无法判断重叠，直接累加。 */
function dayUsage(){
  var iv = [], plain = 0, raw = 0;
  for(var i=0;i<DB.today.length;i++){
    var t = DB.today[i], d = num(t.mins, 0), st = hhmm(t.time);
    raw += d;
    if(st !== null && d > 0) iv.push([st, st + d]);
    else plain += d;
  }
  iv.sort(function(a, b){ return a[0] - b[0]; });
  var span = 0, s = null, e = 0;
  for(var j=0;j<iv.length;j++){
    if(s === null){ s = iv[j][0]; e = iv[j][1]; }
    else if(iv[j][0] <= e){ if(iv[j][1] > e) e = iv[j][1]; }
    else { span += e - s; s = iv[j][0]; e = iv[j][1]; }
  }
  if(s !== null) span += e - s;
  var used = plain + span;
  return { used: used, raw: raw, saved: raw - used };
}
function dayMins(){ return dayUsage().used; }

}
function fallbackCopy(s){
  try{
    var ta = document.createElement("textarea");
    ta.value = s; ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast("已复制到剪贴板", "g");

}

function diagnose(){
  var out = [];
  if(DB.ui.tab !== "daily") return out;
  var undecomposed = [], unassigned = 0, noAct = [];
  for(var i=0;i<DB.goals.length;i++){
    var g = DB.goals[i];
    if(!g.quad) unassigned++;
    if(!str(g.text).trim()) continue;
    if(!str(g.act).trim()) noAct.push(g);
    if(towerDone(g) < BRICKS.length) undecomposed.push(g);
  }
  if(noAct.length){
    out.push({ lv:"w", go:0, t:"有 " + noAct.length + " 张卡还没拆到「第一步动作」——没有第一步，它就还进不了今天。" });
  }else if(undecomposed.length){
    out.push({ lv:"w", go:0, t:"有 " + undecomposed.length + " 张卡还没拆完五层。拆得越到底，执行时越不需要做选择。" });
  }
  var q2n = 0, q2t = 0;
  for(var a=0;a<DB.goals.length;a++) if(DB.goals[a].quad === "q2") q2n++;
  for(var b=0;b<DB.today.length;b++) if(DB.today[b].quad === "q2") q2t++;
  if(q2n && !q2t){
    out.push({ lv:"b", go:2, t:"第二格（重要不紧急）今天一条都没有。这一格永远不喊疼，所以永远被推到明天。" });
  }
  var over = dayMins() - num(DB.avail, 480);
  if(over > 0) out.push({ lv:"b", go:2, t:"今日已排超 " + minLabel(over) + "。" + loadMsg(over) });
  var nodod = 0;
  for(var c=0;c<DB.today.length;c++){
    if(str(DB.today[c].text).trim() && !str(DB.today[c].dod).trim()) nodod++;
  }
  if(nodod) out.push({ lv:"w", go:2, t:nodod + " 条任务没有交付标准——少了它，你会永远觉得「还没做完」。" });
  if(unassigned) out.push({ lv:"", go:1, t:"还有 " + unassigned + " 条没进象限。分不清边界的，用一句话测试：这件事今天不做，三个月后会后悔吗？" });
  return out;
}

function goalCard(g, idx){
  var done = towerDone(g), q = g.quad ? QUAD[g.quad] : null;

  h += '<div class="goalHead">'

  else h += '<span class="tag gray">未排序</span>';
  if(str(g.text).trim() && done < BRICKS.length) h += '<span class="tag warn">还没拆到底</span>';
  if(done === BRICKS.length) h += '<span class="tag ok">已拆完</span>';
  h += '<div class="goalR"><span class="towerBar">' + towerBar(done, g.open) + '</span>'
    + '<span class="goalPct">' + done + '/' + BRICKS.length + '</span>'
    + '<button class="xbtn" data-del-goal="' + g.id + '" data-nodrag="1" title="删掉这张卡">&#10005;</button>'
    + '</div></div>';
  h += '<div class="tower">';
  for(var i=0;i<BRICKS.length;i++) h += brick(g, i);
  h += '</div>';
  if(done === BRICKS.length){
    h += '<div class="note g" style="margin-top:14px"><b>这张拆完了。</b>五层都落地了，现在它可以进象限了。'
      + (g.quad ? "" : ' <button class="btn sm" data-step="1" style="margin-left:8px">去排序</button>') + '</div>';
  }
  return h + '</section>';
}

function towerBar(done, open){
  var h = "";
  for(var i=0;i<BRICKS.length;i++){
    var cls = i < done ? "on" : (i === open - 1 && i >= done ? "cur" : "");
    h += '<i class="' + cls + '"></i>';
  }
  return h;
}

function brickState(g, i){
  var filled  = str(g[BRICKS[i].k]).trim() !== "";
  var visible = i < g.open;
  var frontier = (i === g.open - 1);
  var open = visible && (!filled || frontier || !!DB.ui.eb[g.id + ":" + i]);
  return { filled:filled, visible:visible, frontier:frontier, open:open };
}

function brick(g, i){
  var b = BRICKS[i], st = brickState(g, i), v = str(g[b.k]);
  var cls = "brick";
  if(!st.visible) cls += " hidden locked";
  else if(st.open) cls += " open";
  else cls += " collapsed";
  var h = '<div class="' + cls + '" data-brick="' + g.id + ':' + i + '" style="--lv:var(--lv' + i + ')">';
  h += '<div class="brickHead" data-btoggle="' + g.id + ':' + i + '">'
    + '<span class="brickIco">' + ico(BRICK_ICO[i], "s") + '</span>'
    + '<span class="brickNo">L' + (i + 1) + '</span>'
    + '<span class="brickName">' + esc(b.n) + '</span>'
    + '<span class="bDot ' + (st.filled ? "done" : (st.frontier ? "cur" : "wait")) + '">'
    + (st.filled ? "&#10003;" : (st.frontier ? "&#9679;" : "&#9675;")) + '</span>'
    + '</div>';
  h += '<div class="brickBody">'
    + '<div class="brickQ">' + esc(b.q) + '</div>'
    + '<textarea rows="2" data-bind="goal:' + g.id + ':' + b.k + '" placeholder="' + esc(b.ph) + '">' + esc(v) + '</textarea>'

/* ---------- 拖拽（鼠标 / 触摸都走同一条逻辑） ---------- */
var DRAG_EV = (typeof window !== "undefined" && typeof window.PointerEvent === "function")
  ? { down:"pointerdown", move:"pointermove", up:"pointerup", cancel:"pointercancel" }
  : (("ontouchstart" in window)
      ? { down:"touchstart", move:"touchmove", up:"touchend", cancel:"touchcancel" }
      : { down:"mousedown", move:"mousemove", up:"mouseup", cancel:null });

var DG = null;
var SUPPRESS_CLICK = false;

function ptOf(e){
  if(e.touches && e.touches.length) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  if(e.changedTouches && e.changedTouches.length) return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY };
  return { x:e.clientX, y:e.clientY };
}
function clearOver(){
  var n = document.querySelectorAll(".over");
  for(var i=0;i<n.length;i++) n[i].classList.remove("over");
}
function zoneAt(x, y){
  if(!document.elementFromPoint) return null;
  var el = null;
  try{ el = document.elementFromPoint(x, y); }catch(e){ return null; }
  if(!el || !el.closest) return null;
  return el.closest("[data-drop]");
}
function dragDown(e){
  /* 用「下一次按下就复位」代替定时器：拖拽结束后浏览器可能补一个 click，
     那个要吃掉；但之后用户正常点的第一下必须能用，不能被定时器误杀 */
  SUPPRESS_CLICK = false;
  if(e.button != null && e.button !== 0) return;
  var t = e.target;
  if(!t || !t.closest) return;
  if(t.closest("[data-nodrag]")) return;
  var h = t.closest("[data-drag]");
  if(!h) return;
  var p = ptOf(e);
  DG = { id:h.getAttribute("data-drag"), el:h, sx:p.x, sy:p.y, active:false, ghost:null };
  document.addEventListener(DRAG_EV.move, dragMove, DRAG_EV.move === "touchmove" ? { passive:false } : false);
  document.addEventListener(DRAG_EV.up, dragUp);
  if(DRAG_EV.cancel) document.addEventListener(DRAG_EV.cancel, dragUp);
}
function dragMove(e){
  if(!DG) return;
  var p = ptOf(e);
  if(!DG.active){
    if(Math.abs(p.x - DG.sx) < 6 && Math.abs(p.y - DG.sy) < 6) return;
    DG.active = true;
    DG.el.classList.add("dragging");
    var gh = document.createElement("div");
    gh.className = "chip ghost";
    var tx = DG.el.querySelector(".ct");
    gh.textContent = tx ? tx.textContent : "拖拽中";
    document.body.appendChild(gh);
    DG.ghost = gh;
  }
  if(e.cancelable) e.preventDefault();
  DG.ghost.style.left = p.x + "px";
  DG.ghost.style.top  = p.y + "px";
  clearOver();
  var z = zoneAt(p.x, p.y);
  if(z) z.classList.add("over");
}
function dragUp(e){
  document.removeEventListener(DRAG_EV.move, dragMove);
  document.removeEventListener(DRAG_EV.up, dragUp);
  if(DRAG_EV.cancel) document.removeEventListener(DRAG_EV.cancel, dragUp);
  if(!DG) return;
  var d = DG; DG = null;
  if(!d.active){
    /* 没移动 = 点击：切换选中。选中后点象限也能放入，给不方便拖的场景兜底 */
    DB.ui.sel = (DB.ui.sel === d.id) ? null : d.id;
    save(); render({ top:false });
    if(DB.ui.sel) toast("已选中，点一个象限把它放进去");
    return;
  }
  if(d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  d.el.classList.remove("dragging");
  clearOver();
  var p = ptOf(e);
  var z = zoneAt(p.x, p.y);
  SUPPRESS_CLICK = true;
  if(!z) return;
  var tgt = z.getAttribute("data-drop");
  assignGoal(d.id, tgt === "pool" ? null : tgt);
}
function assignGoal(id, quad){
  var g = goalById(id);
  if(!g) return;
  var to = isQuad(quad) ? quad : null;
  if(g.quad === to){ DB.ui.sel = null; save(); render({ top:false }); return; }
  g.quad = to;
  DB.ui.sel = null;
  save(); render({ top:false });
  toast(to ? "已放进「" + QUAD[to].n + "」" : "已放回待分配", to ? "g" : "");
}

/* ---------- 结构变化后的轻量同步（不重渲，保住输入焦点） ---------- */
function towerSync(g){
  var root = document.querySelector('[data-goal="' + g.id + '"]');
  if(!root) return;
  var done = towerDone(g);
  for(var i=0;i<BRICKS.length;i++){
    var st = brickState(g, i);
    var el = root.querySelector('[data-brick="' + g.id + ':' + i + '"]');
    if(!el) continue;
    el.classList.toggle("hidden", !st.visible);
    el.classList.toggle("locked", !st.visible);
    el.classList.toggle("open", st.visible && st.open);
    el.classList.toggle("collapsed", st.visible && !st.open);
    var dot = el.querySelector(".bDot");
    if(dot){
      dot.className = "bDot " + (st.filled ? "done" : (st.frontier ? "cur" : "wait"));
      dot.textContent = st.filled ? "\u2713" : (st.frontier ? "\u25CF" : "\u25CB");
    }
    var ec = el.querySelector(".brickEcho");
    if(ec) ec.textContent = str(g[BRICKS[i].k]).trim() || "（未填）";
  }
  var bar = root.querySelector(".towerBar");
  if(bar) bar.textContent = "";
  if(bar) bar.innerHTML = towerBar(done, g.open);
  var pct = root.querySelector(".goalPct");
  if(pct) pct.textContent = done + "/" + BRICKS.length;
  var head = root.querySelector(".goalHead");
  if(head){
    var warn = root.querySelector(".tag.warn"), ok = root.querySelector(".tag.ok");
    var filledText = str(g.text).trim() !== "";
    if(filledText && done === BRICKS.length && !ok){
      if(warn && warn.parentNode) warn.parentNode.removeChild(warn);
      var s = document.createElement("span");
      s.className = "tag ok"; s.textContent = "已拆完";
      if(pct && pct.parentNode) head.insertBefore(s, pct.parentNode);
    }else if(filledText && done < BRICKS.length && !warn){
      if(ok && ok.parentNode) ok.parentNode.removeChild(ok);
      var s2 = document.createElement("span");
      s2.className = "tag warn"; s2.textContent = "还没拆到底";
      if(pct && pct.parentNode) head.insertBefore(s2, pct.parentNode);
    }
  }
}

/* 把「重叠只算一次」这件事说出来，免得看起来像算漏了 */
function railHint(){

  if(u.saved > 0){
    return '时间有重叠，重叠部分只计一次：' + minLabel(u.raw) + ' − 重叠 ' + minLabel(u.saved)
      + ' = 实际占用 <b>' + minLabel(u.used) + '</b>。';
  }
  return '同一时段只算一次占用。两条任务时间若重叠，重叠的那几分钟不会重复计入负载。';
}

/* 时间轨：重叠的块分到不同泳道上下错开，颜色也各不相同——
   同一段时间里放两件事，必须一眼能看出是两个块，而不是糊成一条。 */
var NCOLOR = 6;
/* 先把要画的块收出来，并按实际占用把时间窗收紧到整点——
   固定画 6:00–24:00 的话，下午两条任务会被压成两条细线，字全被裁掉。 */
function railItems(){
  var items = [], lo = -1, hi = -1;
  for(var i=0;i<DB.today.length;i++){
    var t = DB.today[i], st = hhmm(t.time);
    if(st === null) continue;
    var dur = Math.max(20, num(t.mins, 0));
    var en = st + dur;
    if(lo < 0 || st < lo) lo = st;
    if(hi < 0 || en > hi) hi = en;
    items.push({ t:t, st:st, en:en, seq:i });
  }
  items.sort(function(a, b){ return a.st - b.st || a.en - b.en; });
  var S, E;
  if(!items.length){ S = 360; E = 1440; }
  else{
    S = Math.max(0, Math.floor((lo - 30) / 60) * 60);
    E = Math.min(1800, Math.ceil((hi + 30) / 60) * 60);
    if(E - S < 180){                       /* 至少留 3 小时，别把十分钟的事放大成满屏 */
      var mid = Math.round((S + E) / 2);
      S = Math.max(0, mid - 90); E = S + 180;
    }
  }
  return { items:items, S:S, E:E };
}
function railInner(){
  var R = railItems(), items = R.items, S = R.S, E = R.E, SPAN = E - S;

  /* ① 泳道：起点晚于某条已排块终点的，复用那一行；否则另起一行 */
  var lanes = [];
  for(var k=0;k<items.length;k++){
    var it = items[k], put = -1;
    for(var L=0;L<lanes.length;L++){ if(lanes[L] <= it.st){ put = L; break; } }
    if(put < 0){ put = lanes.length; lanes.push(it.en); } else { lanes[put] = it.en; }
    it.lane = put;
  }
  /* ② 配色：给每块挑一个「和所有时间重叠的块都不同」的颜色，保证错开的块颜色一定不一样 */
  for(var k2=0;k2<items.length;k2++){
    var used = {}, taken = {}, ci = 0;
    for(var p=0;p<k2;p++){
      taken[items[p].ci] = true;
      if(items[p].st < items[k2].en && items[k2].st < items[p].en) used[items[p].ci] = true;
    }
    /* 首选：既跟时间重叠的块不撞色，也没被别的块用过 */
    for(var t=1;t<=NCOLOR;t++){ if(!used[t] && !taken[t]){ ci = t; break; } }
    /* 颜色不够分了：退一步，只要不跟时间重叠的块撞色 */
    if(!ci) for(var u=1;u<=NCOLOR;u++){ if(!used[u]){ ci = u; break; } }
    if(!ci) ci = (k2 % NCOLOR) + 1;
    items[k2].ci = ci;
  }

  var nLane = lanes.length < 1 ? 1 : lanes.length;
  var PAD = 44, ROW = 34, BH = 28;
  var h = '<div class="railScroll"><div class="rail" style="height:' + (PAD + nLane * ROW + 2) + 'px">';
  /* 窗口被收紧过才标注，省得每次都多一行字 */
  if(items.length && (S > 360 || E < 1440)){
    h += '<div class="railRange">' + hm(S) + ' – ' + hm(E) + '</div>';
  }
  h += '<div class="railAx">';
  var hrs = SPAN / 60, stp = hrs <= 4 ? 1 : hrs <= 8 ? 2 : hrs <= 14 ? 3 : 4;
  var h0 = Math.ceil(S / 60), h1 = Math.floor(E / 60);
  for(var k3=h0;k3<=h1;k3+=stp){
    var pk = (k3 * 60 - S) / SPAN * 100;
    /* 两端的刻度标签改成靠边对齐，别探出轨道外把容器撑出横向滚动 */
    var tf = pk <= 1 ? "translateX(0)" : pk >= 99 ? "translateX(-100%)" : "translateX(-50%)";
    h += '<i style="left:' + pk + '%"><b style="transform:' + tf + '">' + k3 + ':00</b></i>';
  }
  h += '</div>';
  if(!items.length){
    h += '<div class="railNote">还没有带时间的条目。每条填上「几点开始」，这里就排成一条时间轴。</div>';
  }else{
    for(var j=0;j<items.length;j++){
      var b = items[j];
      var left = (b.st - S) / SPAN * 100;
      var w = Math.min(100 - left, (b.en - b.st) / SPAN * 100);
      var label = str(b.t.text).trim() || "未命名";
      h += '<div class="railBlk c' + b.ci + '" style="left:' + left + '%;width:' + Math.max(w, 2.4)
        + '%;top:' + (PAD + b.lane * ROW) + 'px;height:' + BH + 'px" title="'
        + esc(label) + '　' + hm(b.st) + '–' + hm(b.en) + '（' + (b.en - b.st) + ' 分）">'
        + '<i class="rt">' + hm(b.st) + '</i>' + esc(label) + '</div>';
    }
  }
  return h + '</div></div>';
}

/* 头部那两个标记单独抽出来——输入时只更新它，不重渲整张卡，光标才不会跳 */
function taskFlags(t){

    var q = QUAD[t.quad];
    h += '<span class="tag" style="background:var(' + q.v + ');color:var(--' + q.cls + ')">' + q.cls.toUpperCase() + '</span>';
  }
  if(str(t.text).trim() && !str(t.dod).trim()){
    h += '<span class="tag warn" title="缺交付标准">缺标准</span>';
  }
  return h;
}
function syncTaskFlags(t){
  var el = document.querySelector('[data-flags="' + t.id + '"]');
  if(el) el.innerHTML = taskFlags(t);
}

function loadMsg(over){
  if(over <= 0){
    return "装得下，还余 " + minLabel(-over) + "。留白也是计划的一部分——别急着把它填满。";
  }
  var cands = [];
  for(var i=0;i<DB.today.length;i++){
    var t = DB.today[i], q = t.quad;
    if(q === "q4" || q === "q3") cands.push(t);
  }
  cands.sort(function(a, b){ return num(b.mins, 0) - num(a.mins, 0); });
  var cut = [], acc = 0;
  for(var j=0;j<cands.length && acc < over;j++){ cut.push(cands[j]); acc += num(cands[j].mins, 0); }
  if(cut.length){
    var names = cut.map(function(x){ return (str(x.text).trim() || "未命名") + "（" + num(x.mins, 0) + " 分）"; }).join("、");
    return "超了 " + minLabel(over) + "。按象限顺位，先从这里砍：" + names + "。挪到明天，不要压缩它的交付标准——压标准的代价比推一天大。";
  }
  return "超了 " + minLabel(over) + "，而且全是重要的事。这时候只有一个办法：把其中一条整条移到明天，而不是把它做薄。";
}

/* 只更新读数，不重渲整个负载卡——否则可用时长那个输入框会被换掉、光标丢失 */
function syncLoad(){
  var used = dayMins(), avail = num(DB.avail, 480), over = used - avail;
  var pct = avail > 0 ? Math.min(100, Math.round(used / avail * 100)) : 100;
  var big = document.getElementById("loadBig");
  if(big){ big.textContent = minLabel(used); big.classList.toggle("bad", over > 0); }
  var at = document.getElementById("loadAvailTx");
  if(at) at.textContent = "/ 可用 " + minLabel(avail);
  var bar = document.getElementById("loadBar");
  if(bar){ bar.style.width = pct + "%"; bar.classList.toggle("bad", over > 0); }
  var rw = document.getElementById("railWrap");
  if(rw) rw.innerHTML = railInner();
  var rh = document.getElementById("railHint");
  if(rh) rh.innerHTML = railHint();
  var msg = document.getElementById("loadMsg");
  if(msg){
    msg.textContent = loadMsg(over);
    msg.classList.toggle("b", over > 0);
    msg.classList.toggle("g", over <= 0);
  }
}

function viewHome(){

    + '<div>'

    + '<figcaption>RESTART</figcaption></figure>'
    + '</div></div>';

  h += '<div class="wrap">';
  h += '<div class="secBar"><h2>' + ico("i-today", "l") + '今日行事'
    + '<span class="h2x">3 步流水线</span></h2>'
    + '<span class="hint">按顺序走，别跳步——上一步没落的东西，下一步会卡住</span></div>';
  h += '<div class="tiles">'
    + tileCard({ attr:' data-gostep="0"', ico:"i-step1", tag:"STEP 01", n:"目标分解",
        d:"像搭积木一样一层一层往下拆，上一层答完，下一层才解锁，直到拆出一个今天就能做的动作。",
        l:["五层：是什么 / 为什么 / 到什么程度 / 缺什么 / 第一步","逐层解锁，不用一次填完一张长表单","拆到底的那层直接流进象限"],
        go:"进入目标分解" })
    + tileCard({ attr:' data-gostep="1"', ico:"i-step2", tag:"STEP 02", n:"优先级排序",
        d:"先把拆好的条目全部丢进待分配池，再拖进四个象限；四个格子之间也能来回拖。",
        l:["艾森豪威尔四象限，带坐标轴与象限角标","池子 → 象限，象限 ↔ 象限都能拖","今天第二格空着会被体检提醒"],
        go:"进入优先级矩阵" })
    + tileCard({ attr:' data-gostep="2"', ico:"i-timer", tag:"STEP 03", n:"今日时间块",
        d:"把选中要做的事排进今天的钟点，每条写明交付标准，负载条实时显示排超没有。",
        l:["时间轨可视化，一眼看今天满不满","交付标准写清楚，才不会永远觉得没做完","可用时长可调，超出会标红提醒"],

  h += '<div class="secBar"><h2>' + ico("i-library", "l") + '更多'

        d:CATS.length + " 个类目，一类一张卡；每张卡背后只留一个最扛事的模型。",
        l:["八个类目：决策、根因、执行、情绪、沟通、习惯、学习、博弈","点开卡片就是该类目模型的填写格，填完存在本机","每条都写了「换个打法」，这条路不通时知道往哪拐"],

    + tileCard({ attr:' data-act="openSettings"', ico:"i-settings", tag:"DATA", n:"设置与数据",

function firstEmptyStep(m){
  var o = DB.kb[m.id] || {};
  for(var i=0;i<m.f.length;i++) if(!str(o["f" + i]).trim()) return i;
  return -1;
}
function stepBlk(m, i){
  var key = m.id + ":" + i;
  var v = str((DB.kb[m.id] || {})["f" + i]);
  var filled = v.trim() !== "";
  var fe = firstEmptyStep(m);
  var explicit = Object.prototype.hasOwnProperty.call(DB.ui.stepOpen, key) ? DB.ui.stepOpen[key] : null;
  var open = (explicit === null) ? (i === fe) : !!explicit;
  var h = '<div class="stepBlk' + (open ? " open" : "") + (filled ? " filled" : "") + '" data-step-blk="' + key + '">';
  /* 折叠时只显示「步骤名 + 已填内容（没填就说没填）」，
     完整提示只在展开后的 .brickQ 里出现一次，输入框用通用占位符——同一句提示不再重复三遍 */
  h += '<div class="stepHead" data-step-toggle="' + key + '">'
    + '<span class="stepNo">' + (i + 1) + '</span>'
    + '<span class="stepTx"><b>' + esc(m.f[i][0]) + '</b>'
    + '<span>' + esc(oneLine(v) || "还没填 · 点开看这一步要回答什么") + '</span></span>'
    + '<span class="catArrow">&#9654;</span></div>';
  h += '<div class="stepBody">'
    + '<div class="brickQ">' + esc(m.f[i][1]) + '</div>'
    + '<textarea rows="3" data-bind="kb:' + m.id + ':f' + i + '" placeholder="把你的答案写在这里">' + esc(v) + '</textarea>'
    + '</div></div>';
  return h;
}

function settingsSheet(){
  var h = '<div class="mask mid" data-close="1"><div class="sheet" data-stop="1">';
  h += '<div class="sheetHead"><h3>设置与数据</h3>'
    + '<div class="core">主题、每日可用时长，以及备份。</div></div>';
  h += '<h3 class="t" style="margin-top:8px">主题</h3>'
    + '<div class="seg" style="--n:2;--i:' + (DB.theme === "dark" ? 1 : 0) + ';margin-top:10px">'
    + '<div class="segInd"></div>'
    + '<button class="segBtn' + (DB.theme === "light" ? " on" : "") + '" data-set-theme="light">'
    +   '<span class="sn">DAY</span><span class="sb">晨雾（浅色）</span></button>'
    + '<button class="segBtn' + (DB.theme === "dark" ? " on" : "") + '" data-set-theme="dark">'
    +   '<span class="sn">NIGHT</span><span class="sb">夜航（深色）</span></button>'
    + '</div>';
  h += '<h3 class="t" style="margin-top:22px">每天可用时长</h3>'
    + '<div style="margin-top:10px;max-width:220px">'
    + '<input type="number" min="30" step="30" data-num="avail" value="' + Math.round(num(DB.avail, 480)) + '"></div>'
    + '<div class="sub" style="margin-top:7px">第 3 步的负载条按这个数算。宁可少填——留白也是计划的一部分。</div>';
  h += '<h3 class="t" style="margin-top:22px">备份</h3>'
    + '<div class="note"><b>为什么要导出：</b>你的内容只存在这台设备的浏览器里。'
    + '<b>①换设备 / 换浏览器</b>（比如想在手机上看）需要靠它搬；'
    + '<b>②浏览器清理缓存、用无痕模式</b>时数据会消失，导出的文件是唯一的保底；'
    + '<b>③导出的 markdown 可以直接发给我</b>，我按你真实排出来的清单帮你调结构。</div>'
    + '<div class="sheetActs">'
    + '<button class="btn" data-act="expJson">' + ico("i-download", "s") + '导出备份（.json）</button>'
    + '<button class="btn" data-act="impJson">' + ico("i-upload", "s") + '导入备份</button>'
    + '<button class="btn" data-act="expMd">' + ico("i-download", "s") + '导出今日清单（.md）</button>'
    + '<button class="btn pri" data-act="closeSheet">收起</button>'
    + '</div>';
  h += '<div class="note w" style="margin-top:14px"><b>更省事的做法：</b>把这个应用发布成在线链接，'
    + '手机和电脑打开的是同一个页面；如果再接上云端数据库，就能自动同步，连导出都不用点。</div>';
  return h + '</div></div>';
}

function confirmSheet(){
  return '<div class="mask mid" data-close="1"><div class="sheet" data-stop="1" style="max-width:460px">'
    + '<div class="sheetHead"><h3>确认一下</h3></div>'
    + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.7">' + esc(CONFIRM.msg) + '</div>'
    + '<div class="sheetActs">'
    + '<button class="btn" data-act="confirmNo">取消</button>'
    + '<button class="btn pri" data-act="confirmYes">确定</button>'
    + '</div></div></div>';
}

function toast(msg, kind){
  var host = document.getElementById("toastHost");
  if(!host) return null;
  var el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(function(){ el.classList.add("out"); }, 2400);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2950);
  return el;
}
function askConfirm(msg, yes){
  CONFIRM = { msg: msg, yes: yes };
  render({ top:false });
}
/* ============================================================
   交互
   ============================================================ */
document.addEventListener("click", function(e){
  if(SUPPRESS_CLICK){ SUPPRESS_CLICK = false; return; }
  var t = e.target;
  if(!t || !t.closest) return;

  /* 遮罩关闭（点内容区不关） */
  var mk = t.closest("[data-close]");
  if(mk && !t.closest("[data-stop]")){
    DB.ui.open = null; DB.ui.settings = false; CONFIRM = null;
    render({ top:false }); return;
  }
  if(t.closest("[data-act='closeSheet']")){
    DB.ui.open = null; DB.ui.settings = false;
    render({ top:false }); return;
  }
  if(t.closest("[data-act='confirmNo']")){ CONFIRM = null; render({ top:false }); return; }
  if(t.closest("[data-act='confirmYes']")){
    var fn = CONFIRM ? CONFIRM.yes : null;
    CONFIRM = null; render({ top:false });
    if(typeof fn === "function") fn();
    return;
  }

  var el;

  el = t.closest("[data-set-theme]");
  if(el){ setTheme(el.getAttribute("data-set-theme")); save(); render({ top:false }); return; }


  el = t.closest("[data-tab]");
  if(el){
    DB.ui.tab = el.getAttribute("data-tab");
    DB.ui.open = null; DB.ui.settings = false;
    save(); render({ top:true }); return;
  }

  /* 模型库：点类目卡展开该类目的模型面板，再点一次收起 */
  el = t.closest("[data-act='catClose']");
  if(el){ DB.ui.cat = null; save(); render({ top:false }); return; }

  el = t.closest("[data-cat-open]");
  if(el){
    var co = el.getAttribute("data-cat-open");
    DB.ui.cat = (DB.ui.cat === co) ? null : co;
    save(); render({ top:false }); return;
  }

  el = t.closest("[data-gostep]");
  if(el){
    DB.ui.tab = "daily";
    DB.ui.step = parseInt(el.getAttribute("data-gostep"), 10) || 0;
    DB.ui.open = null; DB.ui.settings = false;
    save(); render({ top:true }); return;
  }

  el = t.closest("[data-step]");
  if(el){
    var ns = parseInt(el.getAttribute("data-step"), 10) || 0;
    if(ns !== DB.ui.step){ DB.ui.dir = ns > DB.ui.step ? 1 : -1; }
    DB.ui.step = ns;
    save(); render({ top:true }); return;
  }

  el = t.closest("[data-go]");
  if(el){
    var gi = parseInt(el.getAttribute("data-go"), 10) || 0;
    if(gi !== DB.ui.step) DB.ui.dir = gi > DB.ui.step ? 1 : -1;
    DB.ui.step = gi; save(); render({ top:true }); return;
  }

  /* 卡片内步骤块 */
  el = t.closest("[data-step-toggle]");
  if(el){
    var sk = el.getAttribute("data-step-toggle");
    var cur = el.parentNode.classList.contains("open");
    DB.ui.stepOpen[sk] = !cur;
    save(); render({ top:false }); return;
  }

  /* 乐高层 */
  el = t.closest("[data-btoggle]");
  if(el){
    var bp = el.getAttribute("data-btoggle").split(":");
    var gb = goalById(bp[0]);
    if(gb){
      var bi = parseInt(bp[1], 10);
      var key = bp[0] + ":" + bi;
      var wasOpen = el.parentNode.classList.contains("open");
      if(wasOpen && bi < gb.open - 1 && str(gb[BRICKS[bi].k]).trim()) DB.ui.eb[key] = false;
      else if(!wasOpen) DB.ui.eb[key] = true;
      towerSync(gb); save();
    }
    return;
  }

  /* 删除与勾选必须排在 [data-ttoggle] 之前判。
     × 按钮与勾选框都在 .taskHead 内部，而 .taskHead 带 data-ttoggle；
     若让 ttoggle 先判，它那句 return 会把整个 click 处理掐断 —— × 永远删不掉、勾也永远勾不上。 */
  el = t.closest("[data-del-goal]");
  if(el){ removeBy(DB.goals, el.getAttribute("data-del-goal")); DB.ui.sel = null; save(); render({ top:false }); return; }
  el = t.closest("[data-del-task]");
  if(el){ removeBy(DB.today, el.getAttribute("data-del-task")); save(); render({ top:false }); return; }
  el = t.closest("[data-check-task]");
  if(el){
    var tk = findById(DB.today, el.getAttribute("data-check-task"));
    if(tk){ tk.done = !!el.checked; save(); render({ top:false }); }
    return;
  }

  /* 任务卡：点头部其余位置 = 展开 / 收起 */
  el = t.closest("[data-ttoggle]");
  if(el){
    if(t.closest("input") || t.closest("button")) return;
    var tid = el.getAttribute("data-ttoggle");
    DB.ui.stepOpen["t:" + tid] = !DB.ui.stepOpen["t:" + tid];
    save(); render({ top:false }); return;
  }

  /* 已选中一条 → 点象限放入 */
  el = t.closest("[data-drop]");
  if(el && DB.ui.sel){
    var dz = el.getAttribute("data-drop");
    assignGoal(DB.ui.sel, dz === "pool" ? null : dz);
    return;
  }

  /* 从重点格拉进今天 */
  el = t.closest("[data-pull]");
  if(el){
    var gg = goalById(el.getAttribute("data-pull"));
    if(gg){
      var nid = uid();
      DB.today.push({ id:nid, text:str(gg.text), time:"", mins:60, dod:str(gg.sub),
        due:"", quad:gg.quad || null, done:false });
      DB.ui.stepOpen["t:" + nid] = true;
      save(); render({ top:false });
      toast("已放进今天，把时间和交付标准补上", "g");
    }
    return;
  }

  /* 动作按钮 */
  el = t.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");

  if(act === "toggleTheme"){ setTheme(DB.theme === "dark" ? "light" : "dark"); save(); render({ top:false }); return; }
  if(act === "openSettings"){ DB.ui.settings = true; render({ top:false }); return; }
  if(act === "coachMore"){ DB.ui.more = !DB.ui.more; render({ top:false }); return; }

  if(act === "addGoal"){
    var ng = { id:uid(), text:"", basis:"", sub:"", cap:"", act:"", quad:null, open:1 };
    DB.goals.push(ng);
    DB.ui.tab = "daily"; DB.ui.step = 0;
    save(); render({ top:false });
    var first = document.querySelector('[data-goal="' + ng.id + '"] textarea');
    if(first && first.focus) try{ first.focus(); }catch(err){}
    return;
  }

  if(act === "addTask"){
    var nt = { id:uid(), text:"", time:"", mins:60, dod:"", due:"", quad:null, done:false };
    DB.today.push(nt);
    DB.ui.stepOpen["t:" + nt.id] = true;
    save(); render({ top:false });
    var ti = document.querySelector('[data-task="' + nt.id + '"] input[type=text]');
    if(ti && ti.focus) try{ ti.focus(); }catch(err2){}
    return;
  }

  if(act === "poolAdd"){ addToPool(); return; }

  if(act === "kbCopy"){
    var mm = kbById(el.getAttribute("data-kb"));
    if(!mm) return;
    var o = DB.kb[mm.id] || {}, out = "# " + mm.n + "\n\n> " + mm.core + "\n\n";
    for(var c=0;c<mm.f.length;c++){
      out += "## " + mm.f[c][0] + "\n" + (str(o["f" + c]).trim() || "（未填）") + "\n\n";
    }
    out += "---\n换个打法：" + mm.alt + "\n";
    copyText(out); return;
  }
  if(act === "kbClear"){
    var mc = kbById(el.getAttribute("data-kb"));
    if(!mc) return;
    askConfirm("清空「" + mc.n + "」这张卡的填写内容？这一步不能撤销。", function(){
      DB.kb[mc.id] = {}; save(); render({ top:false }); toast("已清空");
    });
    return;
  }

  if(act === "expJson"){ exportJson(); return; }
  if(act === "impJson"){ importJson(); return; }
  if(act === "expMd"){ exportMd(); return; }
});

function addToPool(){
  var box = document.getElementById("poolIn");
  var txt = box ? str(box.value) : "";
  var lines = txt.split("\n").map(function(x){ return x.trim(); }).filter(function(x){ return x; });
  if(!lines.length){ toast("先写一条再加入", "b"); return; }
  var exist = {};
  for(var i=0;i<DB.goals.length;i++) exist[str(DB.goals[i].text)] = true;
  var added = 0;
  for(var j=0;j<lines.length;j++){
    if(exist[lines[j]]) continue;
    DB.goals.push({ id:uid(), text:lines[j], basis:"", sub:"", cap:"", act:"", quad:null, open:1 });
    exist[lines[j]] = true; added++;
  }
  save(); render({ top:false });
  var nb = document.getElementById("poolIn");
  if(nb && nb.focus) try{ nb.focus(); }catch(e){}
  toast(added ? "加了 " + added + " 条。想拆解就去第 1 步" : "这几条已经在里面了", added ? "g" : "");
}

/* 输入：只写状态 + 局部同步，不整体重渲（否则光标会跳） */
document.addEventListener("input", function(e){
  var t = e.target;
  if(!t || !t.dataset) return;

  if(t.dataset.bind){
    var v = t.value, p = t.dataset.bind.split(":");
    if(p[0] === "kb"){
      var mid = p[1], fk = p[2];
      if(!DB.kb[mid]) DB.kb[mid] = {};
      DB.kb[mid][fk] = v;
      save();
      var blk = document.querySelector('[data-step-blk="' + mid + ":" + p[2].slice(1) + '"]');
      if(blk){
        blk.classList.toggle("filled", v.trim() !== "");
        var sub = blk.querySelector(".stepTx span");
        if(sub) sub.textContent = oneLine(v) || "还没填 · 点开看这一步要回答什么";
      }
      var pr = document.getElementById("kbProg");
      if(pr && kbById(mid)){
        pr.innerHTML = "<b>" + kbFilled(mid) + "</b>/" + kbById(mid).f.length + "<span>已填</span>";
      }
      return;
    }
    if(p[0] === "goal"){
      var g = goalById(p[1]);
      if(!g) return;
      g[p[2]] = v;
      var bi = -1;
      for(var i=0;i<BRICKS.length;i++) if(BRICKS[i].k === p[2]) bi = i;
      if(bi >= 0 && v.trim() && g.open === bi + 1 && g.open < BRICKS.length) g.open++;
      save();
      towerSync(g);
      syncSegCounts();
      syncCoach();
      return;
    }
    if(p[0] === "task"){
      var tk = findById(DB.today, p[1]);
      if(!tk) return;
      tk[p[2]] = v;
      save();
      if(p[2] === "time" || p[2] === "text" || p[2] === "dod"){
        syncLoad();
        var tc = document.querySelector('[data-task="' + tk.id + '"] .taskTime');
        if(tc && p[2] === "time") tc.textContent = str(tk.time).trim() || "--:--";
        var tx = document.querySelector('[data-task="' + tk.id + '"] .taskTx');
        if(tx && p[2] === "text") tx.textContent = str(tk.text).trim() || "（还没写做什么）";
        syncTaskFlags(tk);
        syncCoach();
      }
      return;
    }
    return;
  }

  if(t.dataset.num){
    var nk = t.dataset.num, nv = num(t.value, 0);
    if(nk === "avail"){ DB.avail = Math.max(30, nv); save(); syncLoad(); return; }
    var q = nk.split(":");
    if(q[0] === "task"){
      var t2 = findById(DB.today, q[1]);
      if(t2){
        t2.mins = Math.max(0, nv);
        save(); syncLoad();
        var mm2 = document.querySelector('[data-task="' + t2.id + '"] .taskMins');
        if(mm2) mm2.textContent = (t2.mins ? t2.mins + "分" : "—");
      }
    }
    return;
  }
});

document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  var t = e.target;
  if(!t || !t.dataset || !t.dataset.enter) return;
  if(t.tagName === "TEXTAREA" && !e.ctrlKey) return;
  e.preventDefault();
  if(t.dataset.enter === "poolAdd") addToPool();
});

function syncSegCounts(){
  var counts = [DB.goals.length, DB.goals.length - assignedCount(), DB.today.length];
  var btns = document.querySelectorAll("[data-step]");
  for(var i=0;i<btns.length && i<3;i++){
    var sb = btns[i].querySelector(".sb");
    if(sb) sb.textContent = STEPS[i].n + (counts[i] ? " " + counts[i] : "");
  }
}

/* ============================================================
   导出 / 导入
   ============================================================ */
function download(name, text, mime, bom){
  try{
    var body = bom ? "\ufeff" : "";
    var blob = new Blob([body + text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 400);
  }catch(e){ toast("导出失败：" + e.message, "b"); }
}
function exportJson(){
  /* JSON 不能加 BOM，否则再导入时 JSON.parse 直接报错 */
  download("自律放大器-备份-" + todayStamp() + ".json",
    JSON.stringify(DB, null, 2), "application/json;charset=utf-8", false);
  toast("已导出备份文件，存好它", "g");
}
function importJson(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var o = JSON.parse(stripBom(str(rd.result)));
        DB = normalize(o);
        setTheme(DB.theme);
        save(); render({ top:true });
        toast("导入成功", "g");
      }catch(err){ toast("这个文件读不出来，确认是「导出备份」生成的 .json 吗？", "b"); }
    };
    rd.readAsText(f, "utf-8");
  });
  inp.click();
}
function exportMd(){
  var L = [];
  L.push("# 今日清单 · " + todayStamp());
  L.push("");
  L.push("> 由「自律放大器」导出。可用 " + minLabel(num(DB.avail, 480)) + "，已排 " + minLabel(dayMins()) + "。");
  L.push("");
  L.push("## 一、今日时间块");
  L.push("");
  if(!DB.today.length) L.push("（空）");
  else{
    L.push("| 开始 | 做什么 | 投入上限 | 交付标准 | 状态 |");
    L.push("|---|---|---|---|---|");
    for(var i=0;i<DB.today.length;i++){
      var t = DB.today[i];
      L.push("| " + (str(t.time).trim() || "—") + " | " + (str(t.text).trim() || "—") + " | "
        + (num(t.mins, 0) ? num(t.mins, 0) + " 分" : "—") + " | " + (str(t.dod).trim() || "—") + " | "
        + (t.done ? "已完成" : "待做") + " |");
    }
  }
  L.push("");
  L.push("## 二、象限分布");
  L.push("");
  for(var k=0;k<QORDER.length;k++){
    var key = QORDER[k], q = QUAD[key];
    L.push("### " + key.toUpperCase() + " " + q.n + "（" + q.a + "）");
    L.push("");
    var any = false;
    for(var j=0;j<DB.goals.length;j++){
      var g = DB.goals[j];
      if(g.quad !== key) continue;
      any = true;
      L.push("- **" + (str(g.text).trim() || "（未命名）") + "**　拆解 " + towerDone(g) + "/" + BRICKS.length + " 层");
      for(var b=1;b<BRICKS.length;b++){
        var val = str(g[BRICKS[b].k]).trim();
        if(val) L.push("  - " + BRICKS[b].n + "：" + val);
      }
    }
    if(!any) L.push("（无）");
    L.push("");
  }
  L.push("## 三、还没进象限的");
  L.push("");
  var n = 0;
  for(var m=0;m<DB.goals.length;m++){
    var gu = DB.goals[m];
    if(gu.quad) continue;
    n++;
    L.push("- **" + (str(gu.text).trim() || "（未命名）") + "**　拆解 " + towerDone(gu) + "/" + BRICKS.length + " 层");
    for(var bb=1;bb<BRICKS.length;bb++){
      var vv = str(gu[BRICKS[bb].k]).trim();
      if(vv) L.push("  - " + BRICKS[bb].n + "：" + vv);
    }
  }
  if(!n) L.push("（无）");
  L.push("");
  var used = [];
  for(var kk in DB.kb){
    if(Object.prototype.hasOwnProperty.call(DB.kb, kk) && kbFilled(kk) > 0) used.push(kk);
  }
  if(used.length){
    L.push("## 四、思维模型库已填写");
    L.push("");
    for(var u=0;u<used.length;u++){
      var mm = kbById(used[u]);
      if(!mm) continue;
      L.push("### " + mm.n);
      L.push("");
      var o = DB.kb[used[u]];
      for(var c=0;c<mm.f.length;c++){
        var v = str(o["f" + c]).trim();
        if(v) L.push("- **" + mm.f[c][0] + "**：" + v);
      }
      L.push("");
    }
  }
  download("今日清单-" + todayStamp() + ".md", L.join("\n"), "text/markdown;charset=utf-8", true);
  toast("已导出 markdown，可以直接发给我", "g");
}

   启动

document.addEventListener(DRAG_EV.down, dragDown, DRAG_EV.down === "touchstart" ? { passive:true } : false);
if(DRAG_EV.cancel) document.addEventListener(DRAG_EV.cancel, dragUp);

(function boot(){
  var saved = load();
  if(saved){ DB = saved; }
  else{
    DB = blank();
    try{
      if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) DB.theme = "dark";
    }catch(e){}
  }
  setTheme(DB.theme);
  render({ top:true });
})();
